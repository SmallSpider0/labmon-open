# TX 的 sshd：隧道专用账号只许在 127.0.0.1:LABMON_PORT 上开反向转发（#165）。放进 /etc/ssh/sshd_config.d/labmon.conf，sshd -t 核对后 reload。
# 占位：LABMON_TUNNEL_USER 换成隧道账号（如 labmon-tunnel，useradd -m -s /usr/sbin/nologin 建，不设口令）；LABMON_PORT 同 nginx 模板。
#
# 账号的 ~/.ssh/authorized_keys 只放 dashboard-host 那把隧道密钥一行，前面加限制（与下面的 Match 块两道）：
#   restrict,port-forwarding,permitlisten="127.0.0.1:LABMON_PORT",command="/bin/false" ssh-ed25519 AAAA… labmon-tunnel@dashboard-host
Match User LABMON_TUNNEL_USER
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding remote
    PermitListen 127.0.0.1:LABMON_PORT
    PermitOpen none
    GatewayPorts no
    X11Forwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    PermitTTY no
    PermitUserRC no
    ForceCommand /bin/false
    # 出口闪断后约 30 秒内自动踢掉半开死连接，避免霸占反向转发端口导致新隧道抢不到端口
    ClientAliveInterval 15
    ClientAliveCountMax 2
# 结束 Match 块：不加的话，主配置里 Include 之后的行会落进上面的 Match，对别的账号不生效（#170）
Match all

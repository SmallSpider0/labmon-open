# TX 的 fail2ban：同一 IP 10 分钟里在 labmon 前缀下被拒（401、403、429）10 次，封 1 小时（#165）。
# 占位：LABMON_PREFIX 同 nginx 模板。拆成两个文件放：
#   /etc/fail2ban/filter.d/labmon.conf  ← [Definition] 那一段
#   /etc/fail2ban/jail.d/labmon.conf    ← [labmon] 那一段
# 装完 fail2ban-client reload，fail2ban-client status labmon 看。日志路径按 TX 的 nginx access_log 改。

# ---- filter.d/labmon.conf ----
[Definition]
# 时间戳那对方括号写 *：fail2ban 匹配前把时间戳从行里删掉，只剩 []（#170）
failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "[A-Z]+ /LABMON_PREFIX/\S* HTTP/[0-9.]+" (?:401|403|429)
ignoreregex =

# ---- jail.d/labmon.conf ----
[labmon]
enabled  = true
port     = http,https
filter   = labmon
# backend：Debian/Ubuntu 缺省是 systemd（读 journal），这里要读日志文件（#170）
backend  = auto
logpath  = /var/log/nginx/access.log
findtime = 10m
maxretry = 10
bantime  = 1h

# TX 的 nginx：把 dashboard-host 看板服务的公网入口挂在 https://<TX>/LABMON_PREFIX/ 下（#165）。装法见 docs/deploy.md「TX：公网入口与看门狗」。
# 占位（装的时候 sed 换掉）：
#   LABMON_PREFIX  随机路径前缀，不带斜杠（openssl rand -hex 12 的输出）
#   LABMON_PORT    隧道在 TX 上听的端口，与 dashboard-host 上公网入口的端口同一个（不是 8765：dashboard-host 上 8765 被别的程序占着，#168）
# 分三段，各放各处。

# ---- 1. http 级（如 /etc/nginx/conf.d/labmon-zones.conf）：限速的两档 ----
limit_req_zone $binary_remote_addr zone=labmon:10m rate=10r/s;          # 一般请求：每 IP 每秒 10 个（突发 40）
limit_req_zone $binary_remote_addr zone=labmon_login:10m rate=6r/m;     # 登录、设口令：每 IP 每分钟 6 个（突发 5）
# limit_req_status 不写在这里：http 级会把同一台上别的站被限速时的返回码一起改成 429（#170），写在下面 labmon 的 location 里

# ---- 2. 现有 443 的 server 块里加这两行（nginx 只认 http、server 级，不能写在 location 里）----
# 客户端证书由维护者的小 CA 签（docs/deploy.md）；optional：别的路径照旧不要证书，labmon 的路径在下面的 location 里查
#   ssl_client_certificate /etc/nginx/labmon-ca.crt;
#   ssl_verify_client optional;

# ---- 3. 同一个 server 块里 include 这一段（如 /etc/nginx/snippets/labmon.conf，server 里写 include snippets/labmon.conf;）----
location = /LABMON_PREFIX {
    return 301 /LABMON_PREFIX/;                        # 补斜杠：页面里的地址都是相对的，没斜杠会解析到前缀外面
}

# Colab 等临时实例接入的 3 条精确路径（#281）：跳过 mTLS 客户端证书拦截，仅凭 Authorization: Bearer 令牌由看板鉴权
# 绝不要把客户端证书私钥上传到 Colab 或云盘；不需要临时实例接入时可注释或删掉下面三段
location = /LABMON_PREFIX/api/ephemeral/push {
    limit_req zone=labmon burst=40 nodelay;
    limit_req_status 429;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
    proxy_buffering off;
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:LABMON_PORT/api/ephemeral/push;
}
location = /LABMON_PREFIX/api/ephemeral/colab {
    limit_req zone=labmon burst=40 nodelay;
    limit_req_status 429;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
    proxy_buffering off;
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:LABMON_PORT/api/ephemeral/colab;
}
location = /LABMON_PREFIX/api/client/ephemeral.py {
    limit_req zone=labmon burst=40 nodelay;
    limit_req_status 429;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:LABMON_PORT/api/client/ephemeral.py;
}

location ^~ /LABMON_PREFIX/ {
    if ($ssl_client_verify != SUCCESS) {
        return 403;                                    # 没有小 CA 签的客户端证书：连登录页都不给
    }
    limit_req zone=labmon burst=40 nodelay;
    limit_req_status 429;                              # 只改 labmon 的限速返回码（嵌套的 location 继承它）
    proxy_set_header Host $host;                       # 公网入口按 [server] public_hosts 认它（写 TX 的 IP 或域名；不带端口按 443）
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cookie_path / /LABMON_PREFIX/;               # 会话 Cookie 只发给 labmon 的路径，不发给 TX 上别的服务
    proxy_read_timeout 60s;
    proxy_buffering off;
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:LABMON_PORT/;          # 末尾的 / 剥掉前缀：服务看到的路径与内网入口一样

    location ~ ^/LABMON_PREFIX/api/(login|setup)$ {   # 登录、设口令另一档（嵌套的 location：if 与 proxy_pass 不继承，照写一遍）
        if ($ssl_client_verify != SUCCESS) {
            return 403;
        }
        limit_req zone=labmon_login burst=5 nodelay;
        rewrite ^/LABMON_PREFIX/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:LABMON_PORT;
    }
}

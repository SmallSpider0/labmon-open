[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "labmon"
version = "0.1.0"
description = "本机各科研项目在实验室 GPU 服务器上跑实验的统一工具：项目看板、工作台与排期、服务器端 worker、组内服务器管理"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
labmon = "labmon.__main__:main"

[tool.setuptools]
packages = ["labmon", "labmon.worker"]

[tool.setuptools.package-data]
labmon = ["page.html", "overview.html", "login.html", "common.js", "overview_js/*.js", "data_root_readme.md", "labmon_worker.py", "fleet_probe.sh", "fleet_guard.sh", "ka.sh"]

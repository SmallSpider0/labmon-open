<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>labmon 工作台</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23378ADD'/%3E%3Crect x='7' y='15' width='4.5' height='10' rx='1.5' fill='%23fff'/%3E%3Crect x='13.75' y='10' width='4.5' height='15' rx='1.5' fill='%23fff'/%3E%3Crect x='20.5' y='18' width='4.5' height='7' rx='1.5' fill='%23fff' opacity='.55'/%3E%3Ccircle cx='22.75' cy='10' r='2.6' fill='%235DCAA5'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --fg: #1d2330; --muted: #6b7280; --faint: #9aa1ab; --line: #e4e7ec; --soft: #eef0f3;
  --ok: #1a7f4b; --warn: #a86400; --bad: #c62828; --accent: #2f6fdd; --heat: #6a3fd0;
  --side: #1d2330; --side-fg: #c9ced8; --side-mut: #8a93a3; --side-on: #2c3442; --side-line: #2c3442;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121519; --card: #1b1f26; --fg: #e6e8ec; --muted: #9aa3ae; --faint: #6b7380; --line: #2b3139; --soft: #242a32;
          --ok: #4cc38a; --warn: #f0a640; --bad: #ff6b6b; --accent: #6ea0ff; --heat: #b39dff;
          --side: #0d1014; --side-fg: #c9ced8; --side-mut: #7d8696; --side-on: #1f252e; --side-line: #1f252e; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); display: flex;
       font: 13px/1.45 -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; }
a { color: var(--accent); text-decoration: none; }
.mut { color: var(--muted); }
.sm { font-size: 11.5px; }
.nw { white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
.sp { flex: 1; }
.cdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex: none; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; flex: none; }

/* ---------- 框架：左侧导航 + 右侧工作区 ---------- */
#side { width: 216px; flex: none; background: var(--side); color: var(--side-fg); display: flex; flex-direction: column;
        height: 100vh; position: sticky; top: 0; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--side-line); color: #fff; }
.brand svg { flex: none; }
.brand b { display: block; font-size: 14.5px; font-weight: 650; }
.brand small { display: block; font-size: 11.5px; color: var(--side-mut); }
.ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nsec { display: flex; align-items: center; gap: 6px; height: 30px; margin: 6px 6px 0; padding: 0 10px; border-radius: 6px;
        font-size: 12px; color: var(--side-mut); cursor: pointer; user-select: none; }
.nsec:hover { background: var(--side-on); color: var(--side-fg); }
.nsec .ico { width: 16px; height: 16px; transition: transform .15s; }
.nsec.fold .ico { transform: rotate(-90deg); }
.nsec .ct { margin-left: auto; font-size: 11px; display: none; }
.nsec.fold .ct { display: inline; }
.nsec.fold + .grp { display: none; }
.top1 { margin-top: 6px; }
.zsep { border-top: 1px solid var(--side-line); margin: 10px 12px 2px; }
.nav { display: flex; align-items: center; gap: 10px; height: 36px; margin: 1px 6px; padding: 0 10px; border-radius: 6px;
       color: var(--side-fg); cursor: pointer; }
.nav:hover { background: var(--side-on); }
.nav.on { background: var(--side-on); color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.nav .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .ct { margin-left: auto; font-size: 11px; color: var(--side-mut); }
.nav .ct.bad { color: #fff; background: var(--bad); border-radius: 9px; padding: 0 6px; font-weight: 600; }
.hico { position: relative; display: flex; flex: none; }
.hico .cdot { position: absolute; right: -3px; bottom: -2px; width: 8px; height: 8px; box-shadow: 0 0 0 2px var(--side); }
.nav.on .hico .cdot, .nav:hover .hico .cdot { box-shadow: 0 0 0 2px var(--side-on); }
.av { width: 22px; height: 22px; border-radius: 5px; flex: none; display: flex; align-items: center; justify-content: center;
      font-size: 10.5px; font-weight: 700; letter-spacing: -.02em; }
.nav .ab { display: none; }
.sfoot { margin-top: auto; border-top: 1px solid var(--side-line); padding: 4px 0; }
.sfoot .nav { color: var(--side-mut); font: inherit; width: calc(100% - 12px); border: 0; background: transparent; text-align: left; }
.sfoot .nav:hover { color: var(--side-fg); background: var(--side-on); }
.kbd { margin-left: auto; font-size: 11px; border: 1px solid var(--side-line); border-radius: 4px; padding: 0 5px; line-height: 16px; }
#side :focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
#side, #main { transition: width .15s; }
/* 收起：只留图标与项目色块，悬停看全名 */
body.mini #side { width: 60px; }
body.mini .brand { justify-content: center; padding: 12px 0; }
body.mini .brand .lbl, body.mini .nav .lbl, body.mini .nav .ct:not(.bad), body.mini .kbd { display: none; }
body.mini .nsec { height: 0; margin: 8px 15px; padding: 0; border-top: 1px solid var(--side-line); border-radius: 0; font-size: 0; cursor: default; }
body.mini .nsec .ico, body.mini .nsec .ct { display: none; }
body.mini .nsec:hover { background: none; }
body.mini .nsec.fold + .grp { display: block; }
body.mini .zsep { display: none; }
body.mini .nav { flex-direction: column; justify-content: center; gap: 1px; height: auto; min-height: 40px; margin: 2px 10px; padding: 6px 0; position: relative; }
body.mini .nav .ico { width: 20px; height: 20px; }
body.mini .nav .ab { display: block; font-size: 10.5px; line-height: 1.2; max-width: 40px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
body.mini .nav .ct.bad { position: absolute; top: 2px; right: 0; font-size: 10px; padding: 0 4px; }
body.mini .sfoot .nav { width: 40px; }
#main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
.bar-top { position: sticky; top: 0; z-index: 3; background: var(--card); border-bottom: 1px solid var(--line);
           padding: 10px 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bar-top h1 { font-size: 16px; font-weight: 650; margin: 0; }
.bar-top:has(.project-title) { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; }
.project-title { min-width: 0; display: flex; gap: 8px; align-items: center; }
.project-title h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.project-actions { display: flex; gap: 6px; white-space: nowrap; }
.project-update, .project-feedback { grid-column: 1 / -1; overflow-wrap: anywhere; }
.crumb { color: var(--muted); font-size: 12px; }
#view { padding: 14px 20px 30px; }
#frames { flex: 1; display: flex; }
#frames iframe { border: 0; width: 100%; flex: 1; min-height: calc(100vh - 50px); background: var(--bg); }
#view[hidden], #frames[hidden], #frames iframe[hidden] { display: none; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; margin-top: 12px; }
.card:first-child { margin-top: 0; }
.chd { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.chd b { font-size: 13px; flex: none; white-space: nowrap; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
.kpis.k5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
@media (max-width: 1100px) { .kpis.k5 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px 10px; min-width: 0; }
.kpi .k { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v { font-size: 22px; font-weight: 650; line-height: 1.25; white-space: nowrap; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 12px; font-weight: 400; color: var(--muted); }
.kpi .s { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.alerts { margin: 0 0 12px; border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); border-radius: 8px;
          background: color-mix(in srgb, var(--bad) 9%, var(--card)); padding: 6px 12px; }
.alerts div { padding: 2px 0; }
/* 看板服务小卡（#166，hostcheck）：一格一项，提醒成立的那格染琥珀色；宽屏一行八格，中等宽度两行，窄屏两列 */
.svc { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 1400px) { .svc { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
.svc-t { background: var(--soft); border: 1px solid transparent; border-radius: 8px; padding: 7px 10px 8px; min-width: 0; }
.svc-t .k { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.svc-t .v { font-size: 17px; font-weight: 650; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.svc-t .v small { font-size: 11.5px; font-weight: 400; color: var(--muted); margin-left: 2px; }
.svc-t .s { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.svc-t.hit { background: color-mix(in srgb, var(--warn) 10%, var(--card)); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.svc-t.hit .v, .svc-t.cau .v, .svc-t.hit.subhit .s { color: var(--warn); }
.svc-t.hit.subhit .v { color: inherit; }                 /* 更新方式：成立的是下面那行（暂停快到期），不是“手动装” */
.svc-t.cau.subhit .v { color: var(--warn); }
.svc-t.off .v { color: var(--faint); font-weight: 500; }
.svc-m { margin: 0 0 8px; padding: 5px 10px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 9%, var(--card)); }   /* 计划维护中（#165） */
.svc-w { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; font-size: 12px; }
.svc-w div { padding: 2px 0; }
.svc-w .w { color: var(--warn); }
/* 资源行：名称 | 按任务分段的条 | 数值 | 近 N 小时小曲线 */
.rs { display: grid; grid-template-columns: minmax(64px, 7.5em) minmax(0, 1fr) max-content minmax(100px, 22%); gap: 7px 12px; align-items: center; }
.rs > .l { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rs > .l a { color: inherit; }                      /* 行名可点（如共享盘 → 按人看）：平时同普通行名，后面一个淡色箭头 */
.rs > .l a::after { content: " ›"; color: var(--faint); }
.rs > .l a:hover, .rs > .l a:hover::after { color: var(--accent); }
.rs > .v { font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rs > .v .mut { margin-left: 6px; }
.spk { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 11px; color: var(--muted); }
svg.spark { flex: 1; min-width: 0; width: 100%; height: 22px; cursor: crosshair; }
.ii { color: var(--faint); cursor: help; font-size: 12px; font-weight: 400; }
/* 主机概况条：租期、容器、本地依赖、续租按钮 */
/* 主机页、详情页顶上的信息条：左边信息（可分两行），右边操作按钮竖直居中，不另起一行 */
.strip { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px 20px; font-size: 12.5px; }
.strip .info { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.strip .line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; }
.strip .it { display: inline-flex; align-items: center; gap: 6px; }
.strip .it > .ico { width: 16px; height: 16px; color: var(--muted); }
.strip .rn { margin: 0; flex-wrap: nowrap; gap: 6px; }
.strip .rn .btn { min-height: 28px; padding-top: 2px; padding-bottom: 2px; }
.strip > .rn-err { grid-column: 1 / -1; margin-top: 0; }
/* 任务卡里的占用时间线（common.js 的 tlSvg）：每台主机每张卡一行 */
#tlbar { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
#tlbar .btn { min-height: 24px; padding: 1px 9px; }
#tlbar .seg { margin-left: 0; }
#tllegend { margin: -2px 0 2px; }
#tlbox { touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; margin-bottom: 4px; }
#tlbox.drag, #tlbox.drag * { cursor: grabbing; }
.tlkey { margin-bottom: 10px; }
.tlkey-l { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 11.5px; color: var(--muted); }
.tlkey-l > span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.tlkey-l svg { flex: none; overflow: visible; }
.tlkey-l > .ops { white-space: normal; }
.tlkey-b { display: none; }
/* 记录卡：一行摘要，点哪项展开哪项 */
.rtab { display: inline-flex; gap: 4px; align-items: baseline; padding: 1px 8px; border-radius: 6px; font-size: 12px; color: var(--fg); font-weight: 400; }
.rtab:hover { background: var(--soft); }
.rtab.on { background: var(--soft); font-weight: 600; }
.rtab .mut { font-weight: 400; }
.bar { position: relative; height: 10px; background: var(--soft); border-radius: 4px; display: flex; gap: 2px; }
.bar.thin { height: 6px; }
tr.sch-pp td { background: var(--soft); }          /* 调度卡按人分组时人那一行（#23） */
.bar.big { height: 16px; }
.bar > i > span { display: block; font-size: 10px; line-height: 16px; color: #fff; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar > i.resv { opacity: .35; background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.6) 0 2px, transparent 2px 5px); }
/* 记录：一条一行，左边分类图标（按色调着色），例行的淡显，出了错的左边一道红；点一行去看它说的那台 */
.rl { display: flex; flex-direction: column; gap: 1px; }
.rr { --tc: var(--muted); display: flex; align-items: flex-start; gap: 10px; padding: 6px 8px; margin: 0 -8px; border-radius: 8px; font-size: 13px; line-height: 1.45; min-width: 0; }
.rr.ok { --tc: var(--ok); } .rr.warn { --tc: var(--warn); } .rr.bad { --tc: var(--bad); box-shadow: inset 2px 0 var(--bad); }
.rr[data-go], .rr[data-drw] { cursor: pointer; }
.rr[data-go]:hover, .rr[data-drw]:hover { background: var(--soft); }
.rr-tm { flex: none; min-width: 3em; padding-top: 1px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rl.long .rr-tm { min-width: 6.6em; }
.rr-ic { flex: none; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
         color: var(--tc); background: color-mix(in srgb, var(--tc) 13%, transparent); }
.rr-ic .ico { width: 13px; height: 13px; stroke-width: 2; }
.rr-b { flex: 1; min-width: 0; }
.rr-m { min-width: 0; overflow-wrap: anywhere; }          /* 按文字排：小签、标签跟着字走，长句在行内折行 */
.rr-m > * + * { margin-left: 6px; }
.rr-m > .rr-x:empty { display: none; }
.rr-k { color: var(--tc); font-weight: 600; font-size: 12px; white-space: nowrap; }
.rr-d { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; white-space: pre-wrap; }
.rr > .ico { flex: none; width: 15px; height: 15px; margin-top: 3px; color: var(--faint); opacity: 0; }
.rr:hover > .ico, .rr:focus-visible > .ico { opacity: 1; }
.rr.dim { color: var(--muted); }
.rr.dim .rr-k { color: var(--muted); font-weight: 500; }
.rr.dim .rr-ic { color: var(--faint); background: var(--soft); }
.rchip { border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; font-size: 11.5px; font-weight: 600; line-height: 17px;
         padding: 0 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
.rchip:hover { border-color: var(--accent); color: var(--accent); }
.rr-n { display: inline-flex; align-items: center; vertical-align: 1px; gap: 2px; border: 0; background: var(--soft); color: var(--muted); font: inherit; font-size: 11.5px;
        padding: 0 4px 0 7px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
.rr-n:hover { color: var(--fg); }
.rr-n .ico { width: 13px; height: 13px; transition: transform .15s; }
.rr-n.on .ico { transform: rotate(180deg); }
.rr-kids { display: grid; grid-template-columns: max-content max-content minmax(0, 1fr); gap: 2px 8px; margin: 5px 0 2px; padding: 5px 0 5px 10px;
           border-left: 2px solid var(--line); font-size: 12px; color: var(--muted); }
.rr-kids > .k { font-weight: 600; }
.rr-kids > span:nth-child(3n) { color: var(--fg); overflow-wrap: anywhere; }
/* 记录页：顶栏选项卡是分类；工具栏是搜索与两个下拉，选上的条件列成可去掉的小签 */
.lgbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.lgq, .lgsel { position: relative; display: inline-flex; align-items: center; min-height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--muted); }
.lgq { flex: 1 1 220px; max-width: 360px; }
.lgq > .ico, .lgsel > .ico { position: absolute; left: 9px; width: 15px; height: 15px; pointer-events: none; }
.lgsel > .ico + select + .ico { left: auto; right: 8px; width: 14px; height: 14px; }
.lgq input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 12.5px; color: var(--fg); padding: 6px 10px 6px 31px; outline: none; }
.lgsel select { appearance: none; -webkit-appearance: none; border: 0; background: transparent; font: inherit; font-size: 12.5px; color: var(--fg);
                padding: 6px 28px 6px 31px; max-width: 220px; cursor: pointer; outline: none; }
.lgq:focus-within, .lgsel:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
.lgsel.on { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); color: var(--accent); }
.lgon { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
.lgchip { display: inline-flex; align-items: center; gap: 4px; border: 0; border-radius: 14px; padding: 2px 6px 2px 9px; font: inherit; font-size: 12px; cursor: pointer;
          background: color-mix(in srgb, var(--accent) 12%, var(--card)); color: var(--accent); }
.lgchip:hover { background: color-mix(in srgb, var(--accent) 20%, var(--card)); }
.lgchip .ico { width: 13px; height: 13px; }
.lglink { border: 0; background: none; font: inherit; font-size: 12px; color: var(--muted); cursor: pointer; padding: 2px 4px; }
.lglink:hover { color: var(--fg); text-decoration: underline; }
.rlog { padding-top: 0; }
@media (max-width: 1180px) {          /* 分类多：窄一点就把选项卡放到第二行，不挤掉右边的更新时间 */
  .bar-top .lgtabs { order: 9; flex-basis: 100%; margin: 0 -20px -11px; padding: 0 6px; }
  .bar-top .lgtabs .ftab { padding: 8px 12px; }
}
.rlog.stale .rl { opacity: .55; transition: opacity .15s; }
.lgday { position: sticky; top: var(--toph, 0px); z-index: 1; display: flex; gap: 8px; align-items: baseline; margin: 0 -12px 2px; padding: 10px 12px 6px;
         background: var(--card); border-bottom: 1px solid var(--line); font-size: 12.5px; }
.lgday:first-child { border-radius: 10px 10px 0 0; }
.rlog .rl { padding: 4px 0 8px; }
.lgmore { display: flex; justify-content: center; padding: 6px 0 10px; }
[tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.bar > i { display: block; height: 100%; border-radius: 4px; min-width: 2px; }
.legend .dot.hatch { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.55) 0 2px, transparent 2px 4px); }
.bar > i.hatch { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.45) 0 3px, transparent 3px 6px); }
.bar > b { position: absolute; top: -3px; width: 2px; height: calc(100% + 6px); background: var(--bad); border-radius: 1px; }
.bar > b.due { background: var(--fg); }            /* 调度卡：应得份额的位置 */
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 11.5px; color: var(--muted); }

/* 调度：已用 / 应得条（与调度卡同一个 shareBar）与权重，下面一排优先、暂停 */
.flags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.flag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; border: 1px solid var(--line); border-radius: 18px; font-size: 12px; }
.flag .k { color: var(--muted); }
.wcap { gap: 2px; padding-right: 3px; }              /* 权重胶囊「权重 − ×1 +」（#143） */
.wcap .k { margin-right: 4px; }
.wcap .num { min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; }
.btn.wb { min-height: 22px; min-width: 24px; padding: 0 6px; justify-content: center; border-radius: 11px; font-size: 14px; line-height: 1; }
/* 归档：抽屉最下面的危险区 */
.card.dz { border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }
.dz-r { display: flex; align-items: center; gap: 10px; }
.dz-r > div { flex: 1; min-width: 0; }
.dz-r > .pop-l { flex: none; }
/* 项目配置：只读的三块小卡、看着是字的标题、一项一行（改了左边蓝线、错了红线） */
.idg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.idt { background: var(--soft); border-radius: 8px; padding: 6px 8px; min-width: 0; }
.idt .k { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.idt .k .ico { width: 12px; height: 12px; }
.idt .k .lnk { margin-left: auto; font-size: 11px; }
.idt code { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cf-idn { margin: 4px 0 6px; font-size: 11.5px; }
.ttl { width: 100%; font: inherit; font-size: 16px; font-weight: 600; line-height: 1.3; color: var(--fg); background: transparent; border: 1px dashed transparent; border-radius: 7px; padding: 5px 8px; margin: 0 0 2px -8px; }
.ttl:hover:not(:disabled) { border-color: var(--line); }
.ttl:focus { outline: none; border: 1px solid var(--accent); background: var(--card); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
.cf-sec { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.cf-h { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; margin-bottom: 2px; }
.cf-h .ico { width: 14px; height: 14px; color: var(--muted); }
.cf-h .sp { flex: 1; }
.cf-h .sm { font-weight: 400; color: var(--muted); text-align: right; }
.fr { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 4px 10px; align-items: start; padding: 6px 0 6px 8px; margin-left: -8px; border-left: 3px solid transparent; border-radius: 2px; }
.fr.wide { grid-template-columns: minmax(0, 1fr); }
.fr > .l { font-size: 12px; color: var(--muted); padding-top: 4px; }
.fr > .c { min-width: 0; }
.fr.dirty { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent) 5%, transparent); }
.fr.err { border-left-color: var(--bad); }
.fr.off .chips, .fr.off .cf-own { opacity: .55; }
.cf-was { font-size: 11.5px; margin-left: 6px; }
.cf-msg { font-size: 11.5px; color: var(--muted); }
.cf-msg:empty { display: none; }
.cf-err { color: var(--bad); font-size: 12px; }
.cf-ln { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.cf-own { display: inline-flex; align-items: center; gap: 5px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.cf-chip { border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; font-size: 12px; line-height: 18px; padding: 2px 10px; border-radius: 12px; cursor: pointer; white-space: nowrap; }
.cf-chip:hover:not(:disabled) { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); color: var(--accent); }
.cf-chip.on { background: color-mix(in srgb, var(--accent) 12%, var(--card)); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.cf-chip:disabled { cursor: default; }
.cf-chip .dft { font-size: 10px; color: var(--faint); font-weight: 400; margin-left: 3px; }
.cf-chip.on .dft { color: inherit; }
.cf-num, .cf-dt, .cf-txt { font: inherit; font-size: 12.5px; min-height: 28px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); }
.cf-num { width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
.cf-dt { color-scheme: light dark; font-variant-numeric: tabular-nums; }
.cf-txt { min-width: 0; border-color: transparent; background: transparent; padding: 2px 8px; }
.cf-txt:hover:not(:disabled) { border-color: var(--line); }
:is(.cf-num, .cf-dt, .cf-txt):focus { outline: none; border-color: var(--accent); background: var(--card); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
:is(.fr.err, .mk-row.err, .gp-row.err) :is(.cf-num, .cf-dt, .cf-txt) { border-color: var(--bad); }
.cf-fix { color: var(--warn); margin: 4px 0 0; }
/* 节奏小图：采集与刷新的刻度（--st：一个间隔占的宽度） */
.rhy { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 2px 6px; align-items: center; font-size: 10.5px; color: var(--muted); margin: 6px 0 0; max-width: 360px; }
.rhy .tk { height: 9px; border-bottom: 1px solid var(--line); background: repeating-linear-gradient(90deg, var(--accent) 0 2px, transparent 2px var(--st)) 0 100% / 100% 7px repeat-x; }
.rhy .tk.r { background: repeating-linear-gradient(90deg, var(--muted) 0 2px, transparent 2px var(--st)) 0 100% / 100% 5px repeat-x; }
.rhy .ax { grid-column: 2; display: flex; justify-content: space-between; }
/* 里程碑：小时间轴 + 一行一个 */
.mtl { position: relative; height: 54px; margin: 2px 4px 6px; }
.mtl .ln, .mtl .past { position: absolute; left: 0; top: 30px; height: 2px; background: var(--line); border-radius: 1px; }
.mtl .ln { right: 0; }
.mtl .past { background: var(--faint); }
.mtl .now { position: absolute; top: 18px; width: 2px; height: 26px; background: var(--accent); border-radius: 1px; }
.mtl .now span { position: absolute; top: 28px; left: 50%; transform: translateX(-50%); font-size: 10.5px; color: var(--accent); white-space: nowrap; }
.mtl .mk { position: absolute; top: 25px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
.mtl .mk i { width: 10px; height: 10px; transform: rotate(45deg); background: var(--warn); border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--warn); }
.mtl .mk.gone i { background: var(--faint); box-shadow: 0 0 0 1px var(--faint); }
.mtl .mk span { position: absolute; bottom: 16px; font-size: 11px; white-space: nowrap; color: var(--fg); }
.mtl .mk.gone span { color: var(--muted); }
.mtl .mk em { position: absolute; top: 14px; font-size: 10.5px; font-style: normal; color: var(--muted); white-space: nowrap; }
.mk-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; padding: 3px 0; }
.mk-row .cf-txt { flex: 1 1 120px; }
.mk-row .cf-tm { width: 96px; }
.mk-row .mk-w { font-size: 11.5px; color: var(--muted); white-space: nowrap; min-width: 54px; text-align: right; }
.mk-row.gone :is(.cf-dt, .cf-txt) { color: var(--muted); }
.mk-row > .cf-msg { flex-basis: 100%; }
.cf-x { border: 0; background: none; color: var(--faint); font: inherit; font-size: 15px; line-height: 1; padding: 3px 5px; cursor: pointer; border-radius: 5px; }
.cf-x:hover:not(:disabled) { color: var(--bad); background: var(--soft); }
.cf-x:disabled { opacity: .3; cursor: default; }
.gp-ud .cf-x:hover:not(:disabled) { color: var(--fg); }
.cf-add { border: 1px dashed var(--line); background: none; color: var(--muted); font: inherit; font-size: 12px; border-radius: 7px; padding: 3px 10px; cursor: pointer; margin-top: 4px; }
.cf-add:hover { color: var(--accent); border-color: var(--accent); }
.cf-none, .cf-un, .cf-ft { margin: 4px 0; }
.cf-ft { font-size: 11.5px; }
/* 计划项：可拖的一行（颜色点下面藏着取色框） */
.gp-row { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 8px; margin: 0 0 4px; background: var(--card); }
.gp-row.auto { background: var(--soft); border-style: dashed; }
.gp-row.auto.new { background: var(--card); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.gp-hd { color: var(--faint); letter-spacing: -2px; user-select: none; -webkit-user-select: none; padding: 0 2px; min-width: 12px; }
.gp-hd[data-sort] { cursor: grab; touch-action: none; -webkit-touch-callout: none; padding: 4px 4px; margin: -4px -2px; border-radius: 5px; }
.gp-hd[data-sort]:hover { color: var(--fg); background: var(--soft); }
@media (pointer: coarse) { .gp-hd[data-sort] { padding: 9px 8px; margin: -9px -4px; } }
/* 拖动排顺序（common.js 的 sortBind）：被拖的行抬起跟着指针，其余行让位，落点画虚线占位；拖出列表时被拖的行变淡、占位收起 */
.sort-list { position: relative; }
.sort-shift { transition: transform .15s ease; }
.sort-lift { position: relative; z-index: 3; box-shadow: 0 6px 18px rgba(0, 0, 0, .18); cursor: grabbing; }
.sort-lift.sort-out { opacity: .5; }
.sort-ph { position: absolute; left: 0; right: 0; border: 1.5px dashed var(--accent); border-radius: 8px; background: color-mix(in srgb, var(--accent) 6%, transparent); pointer-events: none; transition: top .15s ease; box-sizing: border-box; }
body.sorting, body.sorting * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
.gp-c { position: relative; display: inline-flex; width: 18px; height: 18px; align-items: center; justify-content: center; flex: none; }
.gp-c i { display: block; width: 11px; height: 11px; border-radius: 50%; }
.gp-c input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; padding: 0; border: 0; }
.gp-c input:disabled { cursor: default; }
.gp-row .cf-txt { flex: 1 1 100px; }
.gp-l { flex: 1 1 100px; min-width: 0; font-size: 12.5px; padding: 0 8px; }
.gp-id { color: var(--faint); }
.gp-n { color: var(--muted); white-space: nowrap; }
.gp-ud { display: inline-flex; }
.gp-row > .cf-msg { flex-basis: 100%; }
.swr { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12.5px; cursor: pointer; }
/* 告警：一句话（数字嵌在句子里）+ 右边一张小图 */
.al { display: grid; grid-template-columns: 22px minmax(0, 1fr) 150px; gap: 2px 8px; align-items: center; }
.al .ai { color: var(--muted); }
.al .ai .ico { width: 15px; height: 15px; }
.al .s { font-size: 12.5px; line-height: 2.1; }
.al .s .cf-num { min-height: 26px; }
.al .v { font-size: 11px; color: var(--muted); }
.al .v .bar { margin: 3px 0 2px; }
.al .v .bar > b { background: var(--warn); }
.tks { background: repeating-linear-gradient(90deg, var(--faint) 0 2px, transparent 2px var(--st)) 0 100% / 100% 6px repeat-x; border-radius: 0; border-bottom: 1px solid var(--line); }
.cf-sw { vertical-align: -5px; }
/* 改了没保存：贴在抽屉底部 */
.cf-save { position: sticky; bottom: 0; z-index: 2; margin: 8px -12px -10px; padding: 8px 12px 10px; background: color-mix(in srgb, var(--card) 94%, transparent);
           backdrop-filter: blur(6px); border-top: 1px solid var(--line); box-shadow: 0 -6px 18px rgba(0, 0, 0, .08); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px;
           border-radius: 0 0 10px 10px; }
.cf-save:empty { display: none; }
.cf-save .what { flex: 1 1 200px; min-width: 0; font-size: 12.5px; }
.cf-save .what b { color: var(--accent); }
.cf-save .rn-err, .cf-tell { flex-basis: 100%; }
.cf-tell { font-size: 11.5px; }
.cf-diff { flex-basis: 100%; margin: 2px 0 0; padding: 6px 8px; border-radius: 7px; background: var(--soft); font: 11.5px/1.6 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-all; }
.cf-diff .d { color: var(--bad); }
.cf-diff .a { color: var(--ok); }
.rg-q > summary { margin: 2px 0; }
.rg-hid { padding: 4px 0; }
.rg-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
.gd-h + .rg-row, .dfold > summary + .rg-row { border-top: 0; }
.rg-row .ln { flex: 0 0 auto; min-width: 48px; }
.rg-row .rq { flex: 1 1 220px; min-width: 0; }
.rg-row .rq code { font: 11.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace; word-break: break-all; }
.rg-row .rx { flex-basis: 100%; }
.ad-p { margin-top: 6px; }                                            /* 接上卡：按项目分组的勾选行 */
.ad-row { cursor: pointer; align-items: center; }
.ad-row input { margin: 0; }
.ad-h { margin-top: 8px; }
.adopt .rn { margin-top: 10px; }
.rg-more { margin-top: 10px; }
.fc-gpu { display: flex; align-items: flex-end; gap: 10px; min-height: 28px; }
.gt { display: flex; align-items: flex-end; gap: 4px; }
.gt.one i { width: 22px; }
.gt i { position: relative; display: block; width: 15px; height: 28px; border-radius: 4px; background: var(--soft); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.gt i b { position: absolute; left: 0; right: 0; bottom: 0; display: block; }
.fc-num { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.fc-num b { font-size: 15px; font-weight: 650; white-space: nowrap; font-variant-numeric: tabular-nums; }
.fc-num small { font-size: 11.5px; font-weight: 400; color: var(--muted); }
.fc-what { min-height: 1.45em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fc-hs .hs { min-width: 0; }
.fc-ft { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; min-height: 20px; margin-top: auto; }
.fc-ft .mini-btn { margin-left: auto; }
.fc.add { align-items: center; justify-content: center; gap: 2px; min-height: 150px; border-style: dashed; background: transparent; color: var(--muted); text-align: center; }
.fc.add .plus { font-size: 26px; line-height: 1; color: var(--accent); }
.fc.add b { color: var(--fg); }
button.fc.add:hover:not(:disabled) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 5%, transparent); }
button.fc.add:disabled { opacity: .55; cursor: default; }
a.btn { display: inline-flex; align-items: center; }
#fpanel { scroll-margin: 90px 0 20px; }
.db #fpanel, .db #pset { scroll-margin: 12px; }
#fpanel > .rn-note:first-child, #fpanel > .wz-q:first-child { margin-top: 0; }
.wz-q { font-weight: 600; }
.wz-q .sm { margin-left: 8px; font-weight: 400; }
.wz-pp { display: flex; flex-direction: column; gap: 8px; margin: 10px 0 4px; }
.pg-row { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 4px 12px; align-items: center; }
.pg-row > .k { font-size: 12px; font-weight: 600; color: var(--muted); }
.pchips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.pchip { display: inline-flex; align-items: center; gap: 7px; min-width: 92px; padding: 4px 10px 4px 5px; border: 1px solid var(--line); border-radius: 9px;
         background: var(--card); color: var(--fg); font: inherit; line-height: 1.25; cursor: pointer; text-align: left; }
.pchip .fav { width: 26px; height: 26px; border-radius: 7px; font-size: 10.5px; }
.pc-t { display: flex; flex-direction: column; }
.pc-t span { font-size: 11px; color: var(--muted); }
.pchip:hover { background: var(--soft); }
.pchip.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--card)); }
/* 组内服务器页的选项卡；不在「服务器」选项卡时操作面板缩成一条 */
.ftabs { display: flex; gap: 2px; align-self: stretch; margin: -10px 0 -11px 14px; overflow-x: auto; scrollbar-width: none; }
.ftab { display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-bottom: 2px solid transparent;
        color: var(--muted); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.ftab:hover { color: var(--fg); }
.ftab.on { color: var(--fg); border-bottom-color: var(--accent); }
.ftab .ct { font-size: 11px; background: var(--soft); color: var(--muted); border-radius: 9px; padding: 0 6px; }
.ftab .ct.bad { background: var(--bad); color: #fff; }
.fsum { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 12px; padding: 7px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; font-size: 12.5px; }
.fs { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.fs b { font-weight: 650; font-variant-numeric: tabular-nums; }
.fstrip { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 7px 12px; border-radius: 8px; font-size: 12.5px;
          border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); background: color-mix(in srgb, var(--accent) 6%, var(--card)); }
.fstrip.bad { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); background: color-mix(in srgb, var(--bad) 6%, var(--card)); }
.fstrip a { margin-left: auto; white-space: nowrap; }
/* 人员卡 */
.slcs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.slc { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 11.5px; color: var(--fg); white-space: nowrap; }
a.slc:hover { border-color: var(--accent); }
.slc.lent { border-style: dashed; }
.slc .lnk { margin-left: 4px; font-size: 11.5px; }
.ib { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 7px;
      background: transparent; color: var(--muted); cursor: pointer; }
.ib:hover { background: var(--soft); color: var(--fg); }
.ib .ico { width: 17px; height: 17px; }
.pdef { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-bottom: 10px; padding: 6px 10px; border-radius: 8px; background: var(--soft); }
.pdef > .popw { margin-left: auto; }
.pmore { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
.pmore > .mut { margin-right: 4px; }
.pform { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 12px; align-items: center; }
.pform label { font-size: 12px; color: var(--muted); }
.pform .cap-in.wide { width: 100%; max-width: 560px; }
.pnew { display: inline-flex; align-items: center; gap: 6px; }
.pnew .cap-in { width: 180px; font-size: 13px; }
.cap-in.wide { width: min(480px, 100%); font-size: 13px; }
.wz-ok { display: flex; gap: 8px; margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: color-mix(in srgb, var(--ok) 8%, var(--card)); font-size: 13px; line-height: 1.6; }
.wz-ok > .i { color: var(--ok); font-weight: 700; }
.wz-ok.warn { background: color-mix(in srgb, var(--warn) 9%, var(--card)); }
.wz-ok.warn > .i { color: var(--warn); }
.wz-tg { display: inline-block; margin-top: 8px; }
.wz-adv { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; padding: 8px 10px; border-radius: 8px; background: var(--soft); }
.wz-adv label { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.steps .sm.err { color: var(--bad); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.lanbar { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-bottom: 12px; padding: 8px 12px; border-radius: 8px; font-size: 12.5px;
          border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); background: color-mix(in srgb, var(--warn) 9%, var(--card)); }
.lanbar b { color: var(--warn); }
/* 详情抽屉：桌面从右侧滑出，窄屏从底部升起；背后的页面不动、不滚 */
#drw { position: fixed; inset: 0; z-index: 8; pointer-events: none; }
#drw.on { pointer-events: auto; }
#drw .scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .26); opacity: 0; transition: opacity .24s; }
#drw.on .scrim { opacity: 1; }
#drw .pane { position: absolute; top: 0; right: 0; bottom: 0; width: min(600px, 100vw); display: flex; flex-direction: column; background: var(--bg); outline: none;
             border-left: 1px solid var(--line); box-shadow: -10px 0 30px rgba(0, 0, 0, .14); transform: translateX(104%); transition: transform .26s cubic-bezier(.2, .8, .2, 1); }
#drw.on .pane { transform: none; }
html.drw-on { overflow: hidden; }
.dh { flex: none; display: flex; align-items: center; gap: 9px; min-width: 0; padding: 10px 10px 10px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
.dh .fc-t b { font-size: 15px; }
.dnav { flex: none; display: inline-flex; }
.db { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 28px; }

<main id="main"><div class="bar-top" id="top"></div><div id="view"></div><div id="frames" hidden></div></main>
<nav id="tabbar" aria-label="导航"></nav>

<div id="drw" aria-hidden="true"><div class="scrim" data-dclose></div><section id="drwp" class="pane" tabindex="-1" role="dialog" aria-modal="true" aria-label="详情"></section></div>

<script>
let ME = /*__ME__*/null;        // 看板账号（#160）：看板服务发页面时填，见 common.js 的 canOps
let D = /*__DATA__*/null;
/*__COMMON__*/
const LANOFF = () => D.lan?.ok === false;          // 本机不在内网（看板连不上平台与任何一台服务器）
const g1 = x => x == null ? "—" : (+x).toFixed(1);
const mb2g = x => x == null ? "—" : (x / 1024).toFixed(1);
const pct = (a, b) => b ? Math.round(100 * a / b) : null;
const color = p => D.colors[p] || "var(--muted)";
const jobsOf = h => h.status ? [...h.status.running.map(j => ({...j, src: "worker"})), ...h.status.external.map(j => ({...j, src: "gpu_queue"}))] : [];

/* ---------- 路由：#/、#/log[?筛选]、#/host/<id>、#/p/<id>、#/fleet[/<选项卡>]、#/me（我的账号）；组内服务器的抽屉 #/fleet/srv/<id>、#/fleet/people/<名字>、#/fleet/new/<池>；
   项目的「管理」抽屉 #/p/<id>/manage；已归档的项目 #/archived（总览上的抽屉） ---------- */
let BGTAB = null;           // 抽屉背后的选项卡：从哪个选项卡打开就留在哪个（直接打开链接时按抽屉的种类）
function route(h = location.hash) {
  const dec = decodeURIComponent, pm = h.match(/^#\/p\/([^/]+)\/manage$/);
  if (pm) return {kind: "p", id: dec(pm[1]), drw: {k: "proj", id: dec(pm[1])}};
  if (h === "#/archived") return {kind: "home", drw: {k: "arch", id: ""}};
  const account = h.match(/^#\/me(?:\/(security|tokens|push))?$/);
  if (account) return {kind: "me", tab: account[1] || "overview"};
  const user = h.match(/^#\/admin\/users(?:\/([^/]+)(?:\/(usage))?)?$/);
  if (user) return {kind: "fleet", tab: "people", oldAccount: user[1] ? dec(user[1]) : "", oldUsage: Boolean(user[2])};
  const m = h.match(/^#\/(host|p)\/(.+)$/);
  if (m) return {kind: m[1], id: dec(m[2])};
  let d = h.match(/^#\/log(?:\?(.*))?$/);
  if (d) return {kind: "log", f: Object.fromEntries(new URLSearchParams(d[1] || ""))};
  if (h === "#/fleet/guard") return {kind: "fleet", tab: BGTAB || "slots", drw: {k: "guard", id: ""}};
  if ((d = h.match(/^#\/fleet\/renew(?:\/(.+))?$/))) return {kind: "fleet", tab: BGTAB || "slots", drw: {k: "renew", id: d[1] ? dec(d[1]) : ""}};
  d = h.match(/^#\/fleet\/srv\/(.+)$/);

//   正文里点进去（主机行、记录行、链接）记一条，返回时滚回离开时的位置。

let RKEY = "", RHASH = null, NAVTO = null;            // RHASH：正显示的地址；NAVTO：退回第一层后要换成的地址

function onRoute() {                                  // 只开关抽屉（页面与选项卡不变）时不滚回顶上

function nav(href, bar = false) {                     // bar：从侧栏、底栏、「更多」点的
  const st = history.state || {}, d = st.d || 0, a = route(), b = route(href);
  if (samePage(a, b)) { history.replaceState(st, "", href); return onRoute(); }
  const base = d ? st.b : a.kind === "home", lv = base && b.kind !== "home" ? 1 : 0;
  history.replaceState({...st, y: document.getElementById("main").scrollTop}, "");

// 依赖等不来、因 CPU 被挡是实验会话的事（项目告警 dep:、cpu: 已送到会话），只折在主机页「给实验会话的提示」里；其余要用户看。

function alertsOf(h) {
  const out = [], add = (to, msg) => out.push({to, msg});
  const hl = h.health || {};
  if (hl.state === "lan") {}                     // 本机不在内网：不是这台的问题，页顶统一说
  else if (hl.state === "down") add("user", `${h.label}：掉线 ${dur(D.generated - hl.since)}。${hl.why}`);
  else if (h.error) add("user", `${h.label}：连不上（${h.error}），持续 3 分钟才算掉线`);
  else if (h.status_error) add("user", `${h.label}：连得上，但 worker 的状态文件读不出（${h.status_error}），下一轮通常就好`);
  else if (!h.status) add("user", `${h.label}：没有 worker 状态（还没部署？labmon worker start ${h.id}）`);
  else if (!h.worker_up) add("user", `${h.label}：worker 已 ${dur(h.age)}没更新状态（容器重启过？labmon worker start ${h.id}）`);
  const m = h.status?.info?.mem;
  if (m && m.limit && m.anon / m.limit >= 0.9) add("user", `${h.label}：收不回的内存 ${g1(m.anon)} / ${g1(m.limit)} GiB，超过 90%${h.status?.gate?.on ? "，已停止放行" : ""}`);
  for (const w of missW(h)) add("user", `${h.label}：${w.name} ${w.why}`);
  for (const w of (h.status?.waiting || []).filter(w => w.dep && w.dep !== "wait")) add("agent", `${h.label}：${pname(w.project)} 的 ${w.name} ${w.why}`);
  for (const w of (h.status?.waiting || []).filter(w => w.cpu_wait)) add("agent", `${h.label}：${pname(w.project)} 的 ${w.name} 因 CPU 被挡 ${dur(w.cpu_wait)}：${w.why}`);
  for (const w of h.borrow?.late || []) add("both", `${h.label}：${pname(w.project)} 的 ${laneName(laneOf(h, w), [h])} 还有 ${w.n} 个任务不会在这台放行：${w.why}；${h.borrow.late_say}`);   // borrow.late_jobs、late_say
  if (h.status?.throttle?.alert) add("both", thrText(h));   // CPU 持续被配额限流（worker 判的，#39）
  const kf = h.status?.kafight;            // worker 记的：要卡时停了的保活又被拉起来（近 1 小时）
  if (kf) add("user", `${h.label}：GPU 保活在任务运行中被拉起 ${kf.n} 次（1 小时内，最近 ${tsNear(kf.t)}），已停；${kf.who}`);

  if (h.auto && !h.error && h.status && !h.worker_up && !h.stopped) add("user", `${h.label}：worker 不在，看板会自动拉起（10 分钟内一次）`);

  if (LIVE) top.push({k: "log", href: "#/log", ico: icon("clock"), label: "记录", on: r.kind === "log", full: "记录：事件、平台操作、配置改动", sub: "事件、平台操作、配置改动"});
  const secs = [
    {id: "host", name: "主机", ct: D.hosts.length, empty: "没有在用的主机", items: D.hosts.map(h => ({href: `#/host/${encodeURIComponent(h.id)}`, on: r.kind === "host" && r.id === h.id,
      ico: `<span class="hico">${icon("server")}<span class="cdot" style="background:${hostDot(h)}"></span></span>`, label: h.label, bad: hal(h), ab: short(h.label),

      sub: `${hostState(h)} · 运行 ${jobsOf(h).length} · 等待 ${(h.status?.waiting || []).length}`}))},
    {id: "proj", name: "项目", ct: D.projects.length, items: D.projects.map(p => ({href: `#/p/${encodeURIComponent(p.id)}`, on: r.kind === "p" && r.id === p.id,
      ico: `<span class="av" style="background:${color(p.id)};color:${inkOn(D.colors[p.id])}">${esc(abbr(p.id))}</span>`, label: p.title || p.id, bad: p.alerts || 0,

      full: fa ? `组内服务器：${fa} 条提醒` : "组内服务器", sub: `${F.servers.length + F.mine.length} 台`,
      subs: [["人员", "#/fleet/people", icon("user")], ["共享盘", "#/fleet/disk", icon("db")], ["保活守护", DH.guard(), icon("shield")]]}]});
  }
  if (!D.fleet && LIVE && ME?.admin && ME.scopes.includes("admin")) secs.push({id: "fleet", name: "组内", sep: true, items: [
    {k: "fleet", href: "#/fleet/people", ico: icon("users"), label: "人员", ab: "人员", on: r.kind === "fleet", full: "组内人员"}]});
  const me = LIVE && ME ? {k: "me", href: "#/me", ico: accAv(ME.name, " nv"), label: ME.name, ab: "我", on: r.kind === "me", cls: "me",
    full: `我的账号：${ME.name}（${ME.role_name}，从${ME.entry_name}来）`, sub: `${ME.role_name} · ${ME.entry_name} · 口令、令牌、登录的浏览器`} : null;

// 项目段末尾的「已归档 N 个」（有归档的项目时才有）：打开已归档的抽屉，在那里恢复（#97）

function side(r) {

  const item = x => `<a class="nav ${x.on ? "on" : ""}${x.cls ? " " + x.cls : ""}" href="${x.href}" ${mini ? tip(x.full || x.label) : ""}>
    ${x.ico}<span class="lbl">${esc(x.label)}</span>${x.ab ? `<span class="ab">${esc(x.ab)}</span>` : ""}${x.bad ? `<span class="ct bad">${x.bad}</span>` : ""}</a>`;

// 窄屏：底栏放总览、组内、记录与「更多」；「更多」从底部滑出，列全部导航（同侧栏）。在主机页、项目页时「更多」算当前
let MORE = false;
function tabbar(r) {
  const {top, secs, me} = navModel(r), fleet = secs.find(g => g.id === "fleet")?.items[0];
  const rest = secs.filter(g => g.id !== "fleet").flatMap(g => g.items);
  const tab = (x, attr = `href="${x.href}"`) => `<a class="tb${x.on ? " on" : ""}" ${attr} ${x.on ? 'aria-current="page"' : ""}>
    <span class="tbi">${x.ico}${x.bad ? `<span class="tbb">${x.bad > 99 ? "99+" : x.bad}</span>` : x.dot ? `<span class="tbb dot"></span>` : ""}</span><span>${esc(x.label)}</span></a>`;
  const tabs = [top[0], fleet && {...fleet, label: "组内"}, top.find(x => x.k === "log")].filter(Boolean)
    .map(x => tab({...x, on: x.on && !MORE}));
  tabs.push(tab({ico: icon("dots"), label: "更多", on: MORE || rest.some(x => x.on) || !!me?.on, dot: rest.some(x => x.bad)}, `href="#" data-more role="button" aria-expanded="${MORE}"`));
  return tabs.join("");
}
function morePanel(r) {

    ${x.bad ? `<span class="badge b-bad">${x.bad}</span>` : ""}${icon("chevr")}</a>`;

function topbar(r) {
  const fs = r.kind === "p" ? frameState() : null, gen = fs?.now || D.generated, off = OFFLINE || fs?.offline;
  const age = Date.now() / 1000 - gen, stale = age > 300;
  let title = "调度总览", crumb = "调度", extra = "";
  if (r.kind === "host") {
    const h = D.hosts.find(x => x.id === r.id);
    title = h ? h.label : r.id; crumb = "主机"; extra = h ? workerBadge(h) : "";
  } else if (r.kind === "log") {
    title = "记录"; crumb = ""; extra = LIVE ? logTabs(r.f) : "";
  } else if (r.kind === "fleet") {
    title = "组内服务器"; crumb = "组内"; extra = D.fleet ? fleetTabs(r.tab) : "";
  } else if (r.kind === "p") {
    const p = D.projects.find(x => x.id === r.id);
    title = p ? p.title || p.id : r.id; crumb = "项目";
  } else if (r.kind === "me") {
    return `<div class="account-content account-top"><h1>我的账号</h1>${LIVE && ME?.account ? meTabs(r.tab) : ""}
      ${off ? `<div class="account-feedback" role="status">${offBadge(off)}</div>` : ""}</div>`;
  }
  if (r.kind === "p") {
    const writable = canWrite(r.id), busy = BUSY || fs?.busy;
    return `<div class="project-title"><span class="crumb">项目 /</span><h1 ${tip(title)}>${esc(title)}</h1></div>
      <div class="project-actions">${writable ? `<button class="btn" data-now ${busy ? "disabled" : ""} ${tip("立即采集一次")} aria-label="立即采集">${icon("renew")}<span class="dsk">立即采集</span></button>` : ""}
        ${LIVE ? `<button class="btn" data-drw="${esc(DH.proj(r.id))}" aria-label="管理" ${tip("这个项目登记在哪几台主机、调度与配置")}>${icon("gear")}<span class="dsk">管理</span></button>` : ""}</div>
      <div class="project-update sm mut" style="${stale ? "color:var(--bad);font-weight:600" : ""}">${tsHM(gen)} 更新${stale ? `（${Math.round(age / 60)} 分钟未更新）` : ""}</div>
      <div class="project-feedback" role="status">${offBadge(off) || (busy ? '<span class="sm mut">采集中…</span>' : "")}</div>`;
  }
  return `${crumb ? `<span class="crumb">${crumb} /</span>` : ""}<h1>${esc(title)}</h1>${extra}<span class="sp"></span>
    ${offBadge(off)}
    <span class="sm mut nw" style="${stale ? "color:var(--bad);font-weight:600" : ""}" ${tip(`${ts(gen)} 更新。每分钟采集一次，页面每 15 秒取一次`)}><span class="dsk">${tsMD(gen)} </span>${tsHM(gen)}<span class="dsk"> 更新</span>${stale ? `（${Math.round(age / 60)} 分钟未更新）` : ""}</span>
    ${canWrite(r.kind === "p" ? r.id : undefined) ? `<button class="btn" data-now ${BUSY ? "disabled" : ""} ${tip("立即采集一次")} aria-label="立即采集">${icon("renew")}<span class="dsk">${BUSY ? "采集中…" : "立即采集"}</span></button>` : ""}
    `;
}

/* ---------- 账号（#160）：「我的账号」#/me（登录了都有）、组内服务器的人员抽屉（管理员）。
   数据现取 /api/me、/api/users（不进快照，进页时取一次，动了以后重取）；口令只在表单里，令牌原文与设置码只显示这一次（关掉、离开这页就没了） ---------- */
const ACC = {me: null, users: null, at: {}, load: {}, loadError: {}, busy: false, msg: null, err: null, show: null, view: null, visit: 0};
// show：刚拿到、只显示这一次的 {page, k: "tok" | "code", where, name, v, until}；msg、err：{k: 显示在哪, m}
const accAv = (n, cls = "") => `<span class="uav${cls}" aria-hidden="true">${esc(pabbr(n))}</span>`;
function uaName(ua) {                                  // 会话的浏览器写成「Safari · macOS」，全文在悬停里
  const s = ua || "", b = /Edg\//.test(s) ? "Edge" : /Firefox\//.test(s) ? "Firefox" : /Chrome\//.test(s) ? "Chrome" : /Safari\//.test(s) ? "Safari" : s ? "其他客户端" : "浏览器";
  const o = /iPhone/.test(s) ? "iPhone" : /iPad/.test(s) ? "iPad" : /Android/.test(s) ? "Android" : /Mac OS X|Macintosh/.test(s) ? "macOS" : /Windows/.test(s) ? "Windows" : /Linux/.test(s) ? "Linux" : "";
  return o ? `${b} · ${o}` : b;
}
const accLine = k => (ACC.msg?.k === k ? `<div class="rn-state">${esc(ACC.msg.m)}</div>` : "") + (ACC.err?.k === k ? `<div class="rn-err">${esc(ACC.err.m)}</div>` : "");
function accLeave(r) {
  const directory = r.kind === "fleet" && (r.tab === "people" || r.drw?.k === "person");
  const view = directory || r.kind === "me" ? location.hash : null;
  if (ACC.view === view) return;
  ACC.view = view; ACC.visit++;
  ACC.show = ACC.msg = ACC.err = null;
  if (POP?.k.startsWith("acc-")) popClose();
  if (!directory) delete ACC.at.users;
  if (r.kind !== "me") delete ACC.at.me;
}
const ACC_LAN = "账号管理只在内网入口：从内网打开看板再管理账号";
const accLan = () => ME?.entry === "lan";
// 账号列表读不了的那句：公网入口的提示不标红、不给重试
const accErr = (e, retry = true) => !e ? "" : e === ACC_LAN ? `<p class="sm mut">${esc(e)}</p>`
  : `<p class="rn-err">${esc(e)}${retry ? ' <button class="lnk" data-acc="reload">重试</button>' : ""}</p>`;
async function accLoad(k) {                            // k：me、users
  if (ACC.load[k]) return;
  ACC.at[k] = Date.now();
  if (k === "users" && !accLan()) { ACC.users = null; ACC.loadError.users = ACC_LAN; return; }   // 公网入口没有 /api/users（#17）：不发请求，直接说
  ACC.load[k] = true;
  try {
    const r = await api(k === "me" ? "api/me" : "api/users", {cache: "no-store"}, {retry: true}), j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "HTTP " + r.status);
    ACC[k] = j;
    if (k === "me") ME = j;                            // 角色变了（被撤了管理员）：侧栏、按钮跟着变
    ACC.loadError[k] = null;
  } catch (e) { ACC[k] = null; ACC.loadError[k] = "读不了：" + (e.message || e); }
  ACC.load[k] = false;
  render(false);
}
async function accPost(path, body, k, reload, after) {
  document.activeElement?.blur?.();                    // 回车提交时焦点还在输入框里：不失焦的话 render 一直被 editing 挡住
  const popup = POP, visit = ACC.visit;
  ACC.busy = true; ACC.err = ACC.msg = null; render(false);
  let ok = false;
  try {
    const r = await postJSON("api/" + path, body), j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "HTTP " + r.status);
    ok = true;
    if (visit === ACC.visit && (!popup || POP === popup)) {
      if (popup) { FFOCUS = popup.trigger || FFOCUS; popClose(); }
      ACC.msg = {k, m: j.msg || "好了"};
      clearTimeout(ACC.mt); ACC.mt = setTimeout(() => { ACC.msg = null; render(false); }, 60000);
      after?.(j);
    }
  } catch (e) { if (visit === ACC.visit && (!popup || POP === popup)) ACC.err = {k: popup ? "pop" : k, m: e.message || String(e)}; }
  ACC.busy = false;
  render(false);
  if (ok) { accLoad(reload); if (reload !== "me" && body?.name === ME?.name) accLoad("me"); }
}
async function accAct(act, d = {}) {
  const v = id => document.getElementById(id)?.value || "", n = d.n;
  if (act === "reload") return accLoad("users");
  if (act === "open-onboard") {
    popToggle("acc-onboard", n, {route: location.hash, trigger: "open-onboard",
      draft: {un: /^[a-z][a-z0-9._-]{0,31}$/i.test(n) ? n : ""}});
    ACC.show = ACC.err = ACC.msg = null;
    FFOCUS = POP ? "acun" : "open-onboard";
    return render(false);
  }
  if (act === "open-pw" || act === "open-tok") {
    const k = act.slice(5);
    popToggle("acc-" + k, ME.name, {route: location.hash, trigger: act, draft: {}});
    ACC.show = ACC.err = ACC.msg = null;
    FFOCUS = POP ? (k === "pw" ? "acpo" : "acn") : act;
    return render(false);
  }
  if (act === "rv" || act === "urv1") {
    popToggle("acc-revoke", d.id, {name: n}); ACC.err = null; return render(false);
  }
  if (act === "revokego" && popIs("acc-revoke", d.id) && POP.name === n)
    return accPost(n ? "users/revoke" : "revoke", n ? {name: n, id: d.id} : {id: d.id}, d.where, n ? "users" : "me");
  if (["role", "publicops", "reset", "urv", "rm"].includes(act)) { popToggle("acc-" + act, n); ACC.err = null; return render(false); }
  if (act === "hosts") {
    const u = ACC.users?.users?.find(u => u.name === n && u.role !== "admin");
    if (!u) return;
    popToggle("acc-hosts", n, {sel: new Set(u.hosts || [])}); ACC.err = null; return render(false);
  }
  if (act === "hostsgo" && popIs("acc-hosts", n)) return accPost("users/hosts", {name: n, hosts: [...POP.sel]}, "list", "users");
  if (act === "push") {
    popToggle("acc-push", ME.name, {kind: ME.push?.kind || "bark"}); ACC.err = null; return render(false);
  }
  if (act === "pushrm") {
    popToggle("acc-pushrm", ME.name); ACC.err = null; return render(false);
  }
  if (act === "pushrmgo") return accPost("push", {push: null}, "push", "me");
  if (act === "pushtest") return accPost("push/test", {}, "push", "me");
  if (act === "pushgo" && popIs("acc-push", ME.name)) {
    const k = POP.kind, target = v("acpushkey").trim(), secret = v("acpushsecret");
    if (!target) { ACC.err = {k: "pop", m: k === "bark" ? "要填 Bark 推送密钥" : "要填 ntfy 主题"}; return render(false); }
    const conf = k === "bark" ? {key: target, encrypt_key: secret} : {topic: target, token: secret};
    return accPost("push", {push: k, [k]: conf}, "push", "me");
  }
  if (act === "showx") { ACC.show = null; return render(false); }
  if (act === "out") { await postJSON("api/logout", {}).catch(() => null); return toLogin(); }
  if (act === "pw" && popIs("acc-pw", ME.name)) {
    document.activeElement?.blur();
    if (!v("acpo") || !v("acpn")) { ACC.err = {k: "pop", m: "原口令、新口令都要填"}; return render(false); }
    if (v("acpn") !== v("acpn2")) { ACC.err = {k: "pop", m: "两遍新口令不一样"}; return render(false); }
    return accPost("password", {old: v("acpo"), new: v("acpn")}, "pw", "me");
  }
  if (act === "tok" && popIs("acc-tok", ME.name)) return accPost("tokens/add", {name: v("acn").trim(), scopes: [v("acs")]}, "tok", "me",
    j => { ACC.show = {page: "me", k: "tok", name: j.name, v: j.token, until: j.until}; ACC.msg = null; });
  if (act === "onboard" && POP?.k === "acc-onboard") {
    const name = v("acun").trim(), person = POP.id;
    if (!name || !person) { ACC.err = {k: "pop", m: "要填登录名并确认组内人员"}; return render(false); }
    return accPost("users/add", {name, admin: v("acur") === "admin", person}, act, "users",
      j => { ACC.show = {k: "code", where: act, name, subject: person, v: j.code}; ACC.msg = null; });
  }
  const U = ACC.users?.users?.find(u => u.name === n);
  if (act === "publicopsgo") return accPost("users/public-ops", {name: n, enabled: !U?.public_ops}, "list", "users");
  if (act === "rolego") return accPost("users/role", {name: n, admin: U?.role !== "admin"}, "list", "users");
  if (act === "resetgo") return accPost("users/reset", {name: n}, "list", "users", j => { ACC.show = {page: "users", k: "code", where: "list", name: n, v: j.code}; ACC.msg = null; });
  if (act === "urvgo") return accPost("users/revoke", {name: n}, "list", "users");
  if (act === "rmgo") return accPost("users/remove", {name: n}, "list", "users", closeDrw);
}
// 只显示这一次的令牌原文、设置码：复制、知道了

/* ---------- 记录 ---------- */
// 筛选（分类、服务器、人、关键字）都在地址里，刷新、分享照样打开；改筛选只换地址、不记历史。
// 分类是顶栏的选项卡（带条数），搜索边打边筛；按天分组，先取 LOGN 条，往下「加载更早」再取
const LOGN = 200;
let LOG = null, LGQ = null, LGT = null; // LOG：当前筛选取到的记录 {key, rows, cats, more, busy, gen, err, stale}；LGQ：搜索框里的字；LGT：停手再筛的计时
const rowKey = e => `${e.t}|${e.kind}|${e.host || ""}|${e.msg}`;
const logHref = f => { const q = new URLSearchParams(Object.entries(f).filter(([, v]) => v)).toString(); return "#/log" + (q ? "?" + q : ""); };
async function logLoad(f, mode) {      // mode：空是换了筛选，"new" 是采集了新的一轮（新的接在前面），"old" 是加载更早
  const L = LOG, q = {...f, limit: LOGN};
  if (mode === "old") q.before = L.rows.at(-1).t + 1;          // 同一秒的可能跨页：含上这一秒、去重
  else q.cats = 1;
  L.busy = true; L.gen = D.generated;
  try {
    const r = await api("records.json?" + new URLSearchParams(q), {cache: "no-store"}, {retry: true});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json(), seen = new Set(), all = mode === "old" ? [...L.rows, ...j.rows] : mode === "new" ? [...j.rows, ...L.rows] : j.rows;
    L.rows = all.filter(e => !seen.has(rowKey(e)) && seen.add(rowKey(e))).sort((a, b) => b.t - a.t);
    if (mode !== "new") L.more = j.more;
    if (j.cats) L.cats = j.cats;
    L.err = null;
  } catch (e) { L.err = "记录读不了：" + (e.message || e); L.rows ||= []; }
  L.busy = L.stale = false;
  if (LOG !== L) return;
  if (document.activeElement?.id === "lgq") { FFOCUS = "lgq"; render("keep"); }     // 正在搜索框里打字：照样重画，光标放回去
  else render(false);
}
function logSet(ch) {
  if (!("q" in ch) || ch.q !== (LGQ ?? "").trim()) LGQ = null;       // 打字触发的保留原样（含末尾空格），别处改的以地址为准
  if (document.activeElement?.id === "lgq") FFOCUS = "lgq";
  clearTimeout(LGT);
  nav(logHref({...route().f, ...ch}));
}
// 顶栏的分类选项卡：条数是同样筛选（服务器、人、关键字）下各分类的，没有记录的分类不列
function logTabs(f) {
  const c = LOG?.cats, all = c && Object.values(c).reduce((a, b) => a + b, 0);
  const tabs = [["", "全部", all], ...(D.event_cats || []).map(([k, n]) => [k, n, c?.[k] || 0])].filter(([k, , n]) => !k || !c || n || k === f.cat);
  return `<nav class="ftabs lgtabs">${tabs.map(([k, n, ct]) => `<a class="ftab${(f.cat || "") === k ? " on" : ""}" href="${esc(logHref({...f, cat: k}))}">${esc(n)}${c ? `<span class="ct">${ct}</span>` : ""}</a>`).join("")}</nav>`;
}
const dayName = t => { const d = new Date(t * 1000), n = new Date(); return (d.toDateString() === n.toDateString() ? "今天 · " : "") + `${tsMD(t)} 周${"日一二三四五六"[d.getDay()]}`; };
const LOGKEEP = "问题报告、掉线与恢复、平台操作、登录退出、主机清单与人员的改动、租期、保活守护、共享盘告警、看板自身的采集出错保留一年；队列与 worker 的保留 30 天。";
function logPage(f) {
  if (!LIVE) return `<div class="card"><div class="empty">记录要经看板服务（labmon serve）打开才看得到。</div></div>`;
  const key = new URLSearchParams(f).toString();
  if (LOG?.key !== key) { LOG = {key, rows: LOG?.rows || null, cats: LOG?.cats, stale: !!LOG?.rows}; logLoad(f); }    // 换筛选时先淡显旧的，不闪「读取中」
  else if (LOG.gen !== D.generated && !LOG.busy) logLoad(f, "new");
  const L = LOG, F = D.fleet;
  const hosts = [...D.hosts.map(h => [h.id, h.label]), ...(F ? [...F.mine, ...F.servers].map(x => [x.id, x.holder ? `${x.holder} ${x.id}` : x.id]) : [])]
    .filter(([id], k, a) => a.findIndex(x => x[0] === id) === k).sort((a, b) => byName(a[0], b[0]));
  if (f.host && !hosts.some(x => x[0] === f.host)) hosts.push([f.host, f.host]);         // 已不在清单里的服务器
  const people = Object.keys(fops().people || {}).sort(byName);
  if (f.who && !people.includes(f.who)) people.push(f.who);
  const opt = (v, name, on) => `<option value="${esc(v)}"${on ? " selected" : ""}>${esc(name)}</option>`;
  const sel = (k, ico, all, opts) => `<label class="lgsel${f[k] ? " on" : ""}">${icon(ico)}<select data-lg="${k}" aria-label="${all}">${opt("", all)}${opts}</select>${icon("chev")}</label>`;
  const chip = (k, ico, text) => `<button class="lgchip" data-lg="rm" data-k="${k}" aria-label="去掉筛选：${esc(text)}">${icon(ico)}${esc(text)}${icon("x")}</button>`;
  const on = [f.host && chip("host", "server", hosts.find(x => x[0] === f.host)[1]), f.who && chip("who", "users", f.who), f.q && chip("q", "search", `“${f.q}”`)].filter(Boolean);
  const n = L.cats && (f.cat ? L.cats[f.cat] || 0 : Object.values(L.cats).reduce((a, b) => a + b, 0));
  let s = `<div class="lgbar">
    <label class="lgq">${icon("search")}<input id="lgq" type="search" placeholder="搜索记录里的文字" value="${esc(LGQ ?? f.q ?? "")}" aria-label="搜索记录" autocomplete="off"></label>
    ${sel("host", "server", "全部服务器", hosts.map(([id, nm]) => opt(id, nm, f.host === id)).join(""))}
    ${sel("who", "users", "全部的人", people.map(x => opt(x, x, f.who === x)).join(""))}
    <span class="sp"></span><span class="sm mut nw">${n != null && !L.stale ? `共 ${n} 条 ` : ""}<span class="ii" ${tip(LOGKEEP)}>ⓘ</span></span></div>`;
  if (on.length) s += `<div class="lgon"><span class="sm mut">筛选</span>${on.join("")}<button class="lglink" data-lg="clear">全部清除</button></div>`;
  s += `<div class="card rlog${L.stale ? " stale" : ""}">`;
  if (!L.rows) return s + `<div class="empty">读取中…</div></div>`;
  if (!L.rows.length) s += `<div class="empty" style="padding:14px 0">${key ? "没有符合筛选的记录。" : "还没有记录。"}</div>`;
  let day = null, grp = [];
  const flush = () => { if (grp.length) s += `<div class="lgday"><b>${dayName(grp[0].t)}</b><span class="sm mut">${grp.length} 条</span></div>` + recList(grp, {showHost: !f.host, day: true}); };
  for (const e of L.rows) {
    const d = new Date(e.t * 1000).toDateString();
    if (d !== day) { flush(); day = d; grp = []; }
    grp.push(e);
  }
  flush();
  if (L.more) s += `<div class="lgmore"><button class="btn" data-lg="more" ${L.busy ? "disabled" : ""}>${L.busy ? "读取中…" : "加载更早"}</button></div>`;
  if (L.err) s += `<div class="rn-err">${esc(L.err)}</div>`;
  return s + `</div>`;
}

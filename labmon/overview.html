<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>labmon 工作台</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23378ADD'/%3E%3Crect x='7' y='15' width='4.5' height='10' rx='1.5' fill='%23fff'/%3E%3Crect x='13.75' y='10' width='4.5' height='15' rx='1.5' fill='%23fff'/%3E%3Crect x='20.5' y='18' width='4.5' height='7' rx='1.5' fill='%23fff' opacity='.55'/%3E%3Ccircle cx='22.75' cy='10' r='2.6' fill='%235DCAA5'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --fg: #1d2330; --muted: #6b7280; --faint: #9aa1ab; --line: #e4e7ec; --soft: #eef0f3;
  --ok: #1a7f4b; --warn: #a86400; --bad: #c62828; --accent: #2f6fdd; --heat: #6a3fd0;
  --side: #1d2330; --side-fg: #c9ced8; --side-mut: #8a93a3; --side-on: #2c3442; --side-line: #2c3442;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121519; --card: #1b1f26; --fg: #e6e8ec; --muted: #9aa3ae; --faint: #6b7380; --line: #2b3139; --soft: #242a32;
          --ok: #4cc38a; --warn: #f0a640; --bad: #ff6b6b; --accent: #6ea0ff; --heat: #b39dff;
          --side: #0d1014; --side-fg: #c9ced8; --side-mut: #7d8696; --side-on: #1f252e; --side-line: #1f252e; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); display: flex;
       font: 13px/1.45 -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; }
a { color: var(--accent); text-decoration: none; }
.mut { color: var(--muted); }
.sm { font-size: 11.5px; }
.nw { white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
.sp { flex: 1; }
.cdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex: none; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; flex: none; }

/* ---------- 框架：左侧导航 + 右侧工作区 ---------- */
#side { width: 216px; flex: none; background: var(--side); color: var(--side-fg); display: flex; flex-direction: column;
        height: 100vh; position: sticky; top: 0; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--side-line); color: #fff; }
.brand svg { flex: none; }
.brand b { display: block; font-size: 14.5px; font-weight: 650; }
.brand small { display: block; font-size: 11.5px; color: var(--side-mut); }
.ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nsec { display: flex; align-items: center; gap: 6px; height: 30px; margin: 6px 6px 0; padding: 0 10px; border-radius: 6px;
        font-size: 12px; color: var(--side-mut); cursor: pointer; user-select: none; }
.nsec:hover { background: var(--side-on); color: var(--side-fg); }
.nsec .ico { width: 16px; height: 16px; transition: transform .15s; }
.nsec.fold .ico { transform: rotate(-90deg); }
.nsec .ct { margin-left: auto; font-size: 11px; display: none; }
.nsec.fold .ct { display: inline; }
.nsec.fold + .grp { display: none; }
.top1 { margin-top: 6px; }
.zsep { border-top: 1px solid var(--side-line); margin: 10px 12px 2px; }
.nav { display: flex; align-items: center; gap: 10px; height: 36px; margin: 1px 6px; padding: 0 10px; border-radius: 6px;
       color: var(--side-fg); cursor: pointer; }
.nav:hover { background: var(--side-on); }
.nav.on { background: var(--side-on); color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.nav .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .ct { margin-left: auto; font-size: 11px; color: var(--side-mut); }
.nav .ct.bad { color: #fff; background: var(--bad); border-radius: 9px; padding: 0 6px; font-weight: 600; }
.hico { position: relative; display: flex; flex: none; }
.hico .cdot { position: absolute; right: -3px; bottom: -2px; width: 8px; height: 8px; box-shadow: 0 0 0 2px var(--side); }
.nav.on .hico .cdot, .nav:hover .hico .cdot { box-shadow: 0 0 0 2px var(--side-on); }
.av { width: 22px; height: 22px; border-radius: 5px; flex: none; display: flex; align-items: center; justify-content: center;
      font-size: 10.5px; font-weight: 700; letter-spacing: -.02em; }
.nav .ab { display: none; }
.sfoot { margin-top: auto; border-top: 1px solid var(--side-line); padding: 4px 0; }
.sfoot .nav { color: var(--side-mut); font: inherit; width: calc(100% - 12px); border: 0; background: transparent; text-align: left; }
.sfoot .nav:hover { color: var(--side-fg); background: var(--side-on); }
.kbd { margin-left: auto; font-size: 11px; border: 1px solid var(--side-line); border-radius: 4px; padding: 0 5px; line-height: 16px; }
#side :focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
#side, #main { transition: width .15s; }
/* 收起：只留图标与项目色块，悬停看全名 */
body.mini #side { width: 60px; }
body.mini .brand { justify-content: center; padding: 12px 0; }
body.mini .brand .lbl, body.mini .nav .lbl, body.mini .nav .ct:not(.bad), body.mini .kbd { display: none; }
body.mini .nsec { height: 0; margin: 8px 15px; padding: 0; border-top: 1px solid var(--side-line); border-radius: 0; font-size: 0; cursor: default; }
body.mini .nsec .ico, body.mini .nsec .ct { display: none; }
body.mini .nsec:hover { background: none; }
body.mini .nsec.fold + .grp { display: block; }
body.mini .zsep { display: none; }
body.mini .nav { flex-direction: column; justify-content: center; gap: 1px; height: auto; min-height: 40px; margin: 2px 10px; padding: 6px 0; position: relative; }
body.mini .nav .ico { width: 20px; height: 20px; }
body.mini .nav .ab { display: block; font-size: 10.5px; line-height: 1.2; max-width: 40px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
body.mini .nav .ct.bad { position: absolute; top: 2px; right: 0; font-size: 10px; padding: 0 4px; }
body.mini .sfoot .nav { width: 40px; }
#main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
.bar-top { position: sticky; top: 0; z-index: 3; background: var(--card); border-bottom: 1px solid var(--line);
           padding: 10px 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bar-top h1 { font-size: 16px; font-weight: 650; margin: 0; }
.bar-top:has(.project-title) { gap: 4px 10px; }
.project-title { flex: 1 1 0; min-width: 4em; display: flex; gap: 8px; align-items: center; }
.project-title .crumb { flex: none; white-space: nowrap; }
.project-title h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.project-actions { display: flex; gap: 6px; flex: none; white-space: nowrap; }
.project-actions:empty, .project-feedback:empty { display: none; }
.project-feedback { flex-basis: 100%; overflow-wrap: anywhere; }
.crumb { color: var(--muted); font-size: 12px; }
#view { padding: 14px 20px 30px; }
#frames { flex: 1; display: flex; }
#frames iframe { border: 0; width: 100%; flex: 1; min-height: calc(100vh - 50px); background: var(--bg); }
#view[hidden], #frames[hidden], #frames iframe[hidden] { display: none; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; margin-top: 12px; }
.card:first-child { margin-top: 0; }
.chd { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.chd b { font-size: 13px; flex: none; white-space: nowrap; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
.kpis.k5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
@media (max-width: 1100px) { .kpis.k5 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px 10px; min-width: 0; }
.kpi .k { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v { font-size: 22px; font-weight: 650; line-height: 1.25; white-space: nowrap; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 12px; font-weight: 400; color: var(--muted); }
.kpi .s { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.alerts { margin: 0 0 12px; border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); border-radius: 8px;
          background: color-mix(in srgb, var(--bad) 9%, var(--card)); padding: 6px 12px; }
.alerts div { padding: 2px 0; }
/* 看板服务小卡（#166，hostcheck）：一格一项，提醒成立的那格染琥珀色；宽屏一行八格，中等宽度两行，窄屏两列 */
.svc { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 1400px) { .svc { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
.svc-t { background: var(--soft); border: 1px solid transparent; border-radius: 8px; padding: 7px 10px 8px; min-width: 0; }
.svc-t .k { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.svc-t .v { font-size: 17px; font-weight: 650; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.svc-t .v small { font-size: 11.5px; font-weight: 400; color: var(--muted); margin-left: 2px; }
.svc-t .s { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.svc-t.hit { background: color-mix(in srgb, var(--warn) 10%, var(--card)); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.svc-t.hit .v, .svc-t.cau .v, .svc-t.hit.subhit .s { color: var(--warn); }
.svc-t.hit.subhit .v { color: inherit; }                 /* 更新方式：成立的是下面那行（暂停快到期），不是“手动装” */
.svc-t.cau.subhit .v { color: var(--warn); }
.svc-t.off .v { color: var(--faint); font-weight: 500; }
.svc-m { margin: 0 0 8px; padding: 5px 10px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 9%, var(--card)); }   /* 计划维护中（#165） */
.svc-w { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; font-size: 12px; }
.svc-w div { padding: 2px 0; }
.svc-w .w { color: var(--warn); }
/* 资源行：名称 | 按任务分段的条 | 数值 | 近 N 小时小曲线 */
.rs { display: grid; grid-template-columns: minmax(64px, 7.5em) minmax(0, 1fr) max-content minmax(100px, 22%); gap: 7px 12px; align-items: center; }
.rs > .l { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rs > .l a { color: inherit; }                      /* 行名可点（如共享盘 → 按人看）：平时同普通行名，后面一个淡色箭头 */
.rs > .l a::after { content: " ›"; color: var(--faint); }
.rs > .l a:hover, .rs > .l a:hover::after { color: var(--accent); }
.rs > .v { font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rs > .v .mut { margin-left: 6px; }
.spk { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 11px; color: var(--muted); }
svg.spark { flex: 1; min-width: 0; width: 100%; height: 22px; cursor: crosshair; }
.ii { color: var(--faint); cursor: help; font-size: 12px; font-weight: 400; }
/* 主机概况条：租期、容器、本地依赖、续租按钮 */
/* 主机页、详情页顶上的信息条：左边信息（可分两行），右边操作按钮竖直居中，不另起一行 */
.strip { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px 20px; font-size: 12.5px; }
.strip .info { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.strip .line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; }
.strip .it { display: inline-flex; align-items: center; gap: 6px; }
.strip .it > .ico { width: 16px; height: 16px; color: var(--muted); }
.strip .rn { margin: 0; flex-wrap: nowrap; gap: 6px; }
.strip .rn .btn { min-height: 28px; padding-top: 2px; padding-bottom: 2px; }
.strip > .rn-err { grid-column: 1 / -1; margin-top: 0; }
/* 任务卡里的占用时间线（common.js 的 tlSvg）：每台主机每张卡一行 */
#tlbar { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
#tlbar .btn { min-height: 24px; padding: 1px 9px; }
#tlbar .seg { margin-left: 0; }
#tllegend { margin: -2px 0 2px; }
#tlbox { touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; margin-bottom: 4px; }
#tlbox.drag, #tlbox.drag * { cursor: grabbing; }
.tlkey { margin-bottom: 10px; }
.tlkey-l { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 11.5px; color: var(--muted); }
.tlkey-l > span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.tlkey-l svg { flex: none; overflow: visible; }
.tlkey-l > .ops { white-space: normal; }
.tlkey-b { display: none; }
/* 记录卡：一行摘要，点哪项展开哪项 */
.rtab { display: inline-flex; gap: 4px; align-items: baseline; padding: 1px 8px; border-radius: 6px; font-size: 12px; color: var(--fg); font-weight: 400; }
.rtab:hover { background: var(--soft); }
.rtab.on { background: var(--soft); font-weight: 600; }
.rtab .mut { font-weight: 400; }
.bar { position: relative; height: 10px; background: var(--soft); border-radius: 4px; display: flex; gap: 2px; }
.bar.thin { height: 6px; }
tr.sch-pp td { background: var(--soft); }          /* 调度卡按人分组时人那一行（#23） */
.bar.big { height: 16px; }
.bar > i > span { display: block; font-size: 10px; line-height: 16px; color: #fff; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar > i.resv { opacity: .35; background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.6) 0 2px, transparent 2px 5px); }
/* 记录：一条一行，左边分类图标（按色调着色），例行的淡显，出了错的左边一道红；点一行去看它说的那台 */
.rl { display: flex; flex-direction: column; gap: 1px; }
.rr { --tc: var(--muted); position: relative; display: flex; align-items: flex-start; gap: 10px; padding: 6px 8px; margin: 0 -8px; border-radius: 8px; font-size: 13px; line-height: 1.45; min-width: 0; }
.rr.ok { --tc: var(--ok); } .rr.warn { --tc: var(--warn); } .rr.bad { --tc: var(--bad); }
.rr.bad::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px; border-radius: 1px; background: var(--bad); }
.rr[data-go], .rr[data-drw] { cursor: pointer; }
.rr[data-go]:hover, .rr[data-drw]:hover { background: var(--soft); }
.rr-tm { flex: none; min-width: 3em; padding-top: 1px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rl.long .rr-tm { min-width: 6.6em; }
.rr-ic { flex: none; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
         color: var(--tc); background: color-mix(in srgb, var(--tc) 13%, transparent); }
.rr-ic .ico { width: 13px; height: 13px; stroke-width: 2; }
.rr-b { flex: 1; min-width: 0; }
.rr-m { min-width: 0; overflow-wrap: anywhere; }          /* 按文字排：小签、标签跟着字走，长句在行内折行 */
.rr-m > * + * { margin-left: 6px; }
.rr-m > .rr-x:empty { display: none; }
.rr-k { color: var(--tc); font-weight: 600; font-size: 12px; white-space: nowrap; }
.rr-d { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; white-space: pre-wrap; }
.rr > .ico { flex: none; width: 15px; height: 15px; margin-top: 3px; color: var(--faint); opacity: 0; }
.rr:hover > .ico, .rr:focus-visible > .ico { opacity: 1; }
.rr.dim { color: var(--muted); }
.rr.dim .rr-k { color: var(--muted); font-weight: 500; }
.rr.dim .rr-ic { color: var(--faint); background: var(--soft); }
.rchip { border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; font-size: 11.5px; font-weight: 600; line-height: 17px;
         padding: 0 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
.rchip:hover { border-color: var(--accent); color: var(--accent); }
.rr-n { display: inline-flex; align-items: center; vertical-align: 1px; gap: 2px; border: 0; background: var(--soft); color: var(--muted); font: inherit; font-size: 11.5px;
        padding: 0 4px 0 7px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
.rr-n:hover { color: var(--fg); }
.rr-n .ico { width: 13px; height: 13px; transition: transform .15s; }
.rr-n.on .ico { transform: rotate(180deg); }
.rr-kids { display: grid; grid-template-columns: max-content max-content minmax(0, 1fr); gap: 2px 8px; margin: 5px 0 2px; padding: 5px 0 5px 10px;
           border-left: 2px solid var(--line); font-size: 12px; color: var(--muted); }
.rr-kids > .k { font-weight: 600; }
.rr-kids > span:nth-child(3n) { color: var(--fg); overflow-wrap: anywhere; }
/* 记录页：顶栏选项卡是分类；工具栏是搜索与两个下拉，选上的条件列成可去掉的小签 */
.lgbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.lgq, .lgsel { position: relative; display: inline-flex; align-items: center; min-height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--muted); }
.lgq { flex: 1 1 220px; max-width: 360px; }
.lgq > .ico, .lgsel > .ico { position: absolute; left: 9px; width: 15px; height: 15px; pointer-events: none; }
.lgsel > .ico + select + .ico { left: auto; right: 8px; width: 14px; height: 14px; }
.lgq input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 12.5px; color: var(--fg); padding: 6px 10px 6px 31px; outline: none; }
.lgsel select { appearance: none; -webkit-appearance: none; border: 0; background: transparent; font: inherit; font-size: 12.5px; color: var(--fg);
                padding: 6px 28px 6px 31px; max-width: 220px; cursor: pointer; outline: none; }
.lgq:focus-within, .lgsel:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
.lgsel.on { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); color: var(--accent); }
.lgon { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
.lgchip { display: inline-flex; align-items: center; gap: 4px; border: 0; border-radius: 14px; padding: 2px 6px 2px 9px; font: inherit; font-size: 12px; cursor: pointer;
          background: color-mix(in srgb, var(--accent) 12%, var(--card)); color: var(--accent); }
.lgchip:hover { background: color-mix(in srgb, var(--accent) 20%, var(--card)); }
.lgchip .ico { width: 13px; height: 13px; }
.lglink { border: 0; background: none; font: inherit; font-size: 12px; color: var(--muted); cursor: pointer; padding: 2px 4px; }
.lglink:hover { color: var(--fg); text-decoration: underline; }
.rlog { padding-top: 0; }
@media (max-width: 1180px) {          /* 分类多：窄一点就把选项卡放到第二行，不挤掉右边的更新时间 */
  .bar-top .lgtabs { order: 9; flex-basis: 100%; margin: 0 -20px -11px; padding: 0 6px; }
  .bar-top .lgtabs .ftab { padding: 8px 12px; }
}
.rlog.stale .rl { opacity: .55; transition: opacity .15s; }
.lgday { position: sticky; top: var(--toph, 0px); z-index: 1; display: flex; gap: 8px; align-items: baseline; margin: 0 -12px 2px; padding: 10px 12px 6px;
         background: var(--card); border-bottom: 1px solid var(--line); font-size: 12.5px; }
.lgday:first-child { border-radius: 10px 10px 0 0; }
.rlog .rl { padding: 4px 0 8px; }
.lgmore { display: flex; justify-content: center; padding: 6px 0 10px; }
[tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.bar > i { display: block; height: 100%; border-radius: 4px; min-width: 2px; }
.legend .dot.hatch { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.55) 0 2px, transparent 2px 4px); }
.bar > i.hatch { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.45) 0 3px, transparent 3px 6px); }
.bar > b { position: absolute; top: -3px; width: 2px; height: calc(100% + 6px); background: var(--bad); border-radius: 1px; }
.bar > b.due { background: var(--fg); }            /* 调度卡：应得份额的位置 */

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>labmon</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23378ADD'/%3E%3Crect x='7' y='15' width='4.5' height='10' rx='1.5' fill='%23fff'/%3E%3Crect x='13.75' y='10' width='4.5' height='15' rx='1.5' fill='%23fff'/%3E%3Crect x='20.5' y='18' width='4.5' height='7' rx='1.5' fill='%23fff' opacity='.55'/%3E%3Ccircle cx='22.75' cy='10' r='2.6' fill='%235DCAA5'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --fg: #1d2330; --muted: #6b7280; --faint: #9aa1ab; --line: #e4e7ec; --soft: #eef0f3;
  --ok: #1a7f4b; --warn: #a86400; --bad: #c62828; --accent: #2f6fdd;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121519; --card: #1b1f26; --fg: #e6e8ec; --muted: #9aa3ae; --faint: #6b7380; --line: #2b3139; --soft: #242a32;
          --ok: #4cc38a; --warn: #f0a640; --bad: #ff6b6b; --accent: #6ea0ff; }
}
* { box-sizing: border-box; }
body { margin: 0; padding: 14px 20px 30px; background: var(--bg); color: var(--fg);
       font: 13px/1.45 -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
.mut { color: var(--muted); }
.sm { font-size: 11.5px; }
.nw { white-space: nowrap; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.sp { flex: 1; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; flex: none; }
.cdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex: none; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.hd { font-size: 12px; font-weight: 600; color: var(--muted); }
.top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.top:has(.project-title) { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }
.project-title { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.project-title > a { flex: none; }
.project-title h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.project-actions { display: flex; gap: 6px; white-space: nowrap; }
.project-meta, .project-feedback { grid-column: 1 / -1; overflow-wrap: anywhere; }
.project-feedback:empty { display: none; }
.top h1 { font-size: 17px; font-weight: 650; margin: 0; }
.alerts { margin: -2px 0 10px; border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); border-radius: 8px;
          background: color-mix(in srgb, var(--bad) 9%, var(--card)); padding: 6px 12px; }
.alerts div { padding: 2px 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px 9px; min-width: 0; }
.kpi .k { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v { font-size: 20px; font-weight: 650; line-height: 1.25; white-space: nowrap; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 12px; font-weight: 400; color: var(--muted); }
.kpi .s { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter { height: 6px; background: var(--soft); border-radius: 3px; position: relative; margin: 5px 0 4px; display: flex; gap: 2px; }
.meter > i { display: block; height: 100%; border-radius: 3px; }
.segs { display: flex; gap: 3px; margin: 5px 0 4px; }
.segs .sg { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; min-width: 0; }
.segs .sg i { display: block; height: 100%; }
.meter > i.ovr { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.4) 0 4px, transparent 4px 8px); }
.meter > b { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--bad); border-radius: 1px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-top: 10px; }
.minis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin-top: 6px; }
.mini { background: var(--soft); border-radius: 8px; padding: 6px 9px 4px; min-width: 0; }
.grow { display: grid; grid-template-columns: minmax(80px, 10em) minmax(0, 1fr) 46px 74px; gap: 8px; align-items: center; padding: 4px 0; }
.job { padding: 6px 0; border-top: 1px solid var(--line); }
.sqs { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 3px; margin-left: 8px; vertical-align: middle; max-width: 100%; }
.gsq { display: inline-block; width: 12px; height: 12px; border-radius: 3px; flex: none; cursor: pointer; transition: transform .1s, box-shadow .1s; }
.gsq:hover { transform: scale(1.3); box-shadow: 0 0 0 1.5px var(--card), 0 0 0 3px var(--fg); position: relative; z-index: 1; }
.gdl > .grow { opacity: .55; border-radius: 4px; transition: opacity .3s, background .3s; }
.gdl > .grow.hl { opacity: 1; background: color-mix(in srgb, var(--accent) 16%, transparent); }
details.rgrp { border-top: 1px solid var(--line); padding: 3px 0; }
details.rgrp:first-of-type { border-top: 0; }
details.rgrp > summary { cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 3px 0; min-width: 0; }
details.rgrp > summary::-webkit-details-marker { display: none; }
details.rgrp > summary::before { content: "▸"; color: var(--faint); font-size: 10px; width: 8px; flex: none; }
details.rgrp[open] > summary::before { content: "▾"; }
.jr { display: grid; grid-template-columns: minmax(70px, 1fr) minmax(0, 7em) 64px 140px; gap: 8px; align-items: center; padding: 2px 0 2px 14px; min-height: 22px; }
.job:first-of-type { border-top: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.hgrp { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.card > .row + .hgrp { border-top: 0; padding-top: 0; }
.hhd { flex-wrap: wrap; gap: 6px 12px; }
.hgrp .minis { margin-top: 6px; }
.chip { background: var(--soft); border-radius: 6px; padding: 2px 8px; font-size: 11.5px; white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; flex: none; }
.seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 11.5px; padding: 2px 9px; cursor: pointer; }
.seg button.on { background: var(--soft); color: var(--fg); font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; font-size: 11.5px; padding: 1px 9px; border-radius: 7px; cursor: pointer; }
.btn:disabled { color: var(--muted); cursor: default; }
svg { display: block; overflow: visible; }
svg text { font-size: 11px; fill: var(--muted); }
svg .lab { fill: var(--fg); font-size: 12px; }
svg rect.j { cursor: pointer; }
/* 依赖连线（depLines）：平时只显关键的；#tlbox.dh 时只显链上的、加深，链外的任务条淡出（#111） */
#tlbox .dl { display: none; }
#tlbox .dl path { fill: none; stroke: var(--fg); stroke-opacity: .35; }
#tlbox .dl path.ar { fill: var(--fg); fill-opacity: .5; stroke: none; }
#tlbox .dl.k { display: inline; }
#tlbox.dh .dl { display: none; }
#tlbox.dh .dl.on { display: inline; }
#tlbox.dh .dl.on path { stroke: var(--accent); stroke-opacity: .95; stroke-width: 1.6; }
#tlbox.dh .dl.on path.ar { fill: var(--accent); fill-opacity: 1; stroke: none; }
#tlbox .jg { transition: opacity .12s; }
#tlbox.dh .jg:not(.on) { opacity: .25; }
#tlbox { touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; }
#tlbox.drag, #tlbox.drag * { cursor: grabbing; }
.ch { width: 100%; cursor: crosshair; }
#tip { position: fixed; z-index: 9; pointer-events: none; background: var(--fg); color: var(--bg); border-radius: 6px; padding: 5px 8px;
       font-size: 12px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; max-width: min(520px, calc(100vw - 32px)); display: none; }
.tlkey { margin-top: 6px; }
.tlkey-l { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 11.5px; color: var(--muted); }
.tlkey-l > span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.tlkey-l svg { flex: none; overflow: visible; }
.tlkey-l > .ops { white-space: normal; }
.tlkey-b { display: none; }
.badge { display: inline-block; padding: 0 6px; border-radius: 8px; font-size: 11.5px; font-weight: 500; line-height: 18px; white-space: nowrap; }
.b-ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.b-warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.b-bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.b-mute { background: color-mix(in srgb, var(--muted) 16%, transparent); color: var(--muted); }
details.jobs, details.res { margin-top: 10px; }
details.jobs > summary, details.res > summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: 12px; padding: 4px 0; }
details.lane { margin-top: 8px; }
details.lane > summary { cursor: pointer; padding: 2px 0; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th, td { text-align: left; padding: 4px 7px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { color: var(--muted); font-weight: 500; font-size: 11.5px; white-space: nowrap; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.hl td { background: color-mix(in srgb, var(--accent) 14%, transparent); }
tr.run td { background: color-mix(in srgb, var(--warn) 7%, transparent); }
.more { color: var(--accent); cursor: pointer; }
.scroll { overflow-x: auto; }
@media (max-width: 760px) {
  body { padding: 10px 10px 24px; }
  .cols { grid-template-columns: minmax(0, 1fr); }
  .hide-sm { display: none; }
  .jr { grid-template-columns: minmax(50px, 1fr) 48px 132px; padding-left: 8px; }
  .tlkey-b { display: inline-block; }
  .tlkey:not(.open) .tlkey-l { display: none; }
  .tlkey.open .tlkey-l { margin-top: 6px; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="tip"></div>
<script>
let ME = /*__ME__*/null;        // 看板账号（#160）：看板服务发页面时填，见 common.js 的 canOps
let D = /*__DATA__*/null;
/*__JS:common.js__*/
// 本机存的设置（common.js 的 mkStore），键名按项目标题分开：SS 只存这一次浏览（滚动位置、展开了什么），LS 长期存（筛选、时间线视图）
const KEY = "labmon:" + (D && D.title || "");
const SS = mkStore(KEY, sessionStorage), LS = mkStore(KEY);
const f1 = (x, d = 1) => x == null || isNaN(x) ? "—" : Number(x).toFixed(d);
let NOW = D ? D.generated : 0;
const avg = a => { const v = (a || []).filter(x => x != null); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
const sum = a => (a || []).reduce((s, x) => s + (x || 0), 0);
const ST = {done: ["完成", "b-ok"], failed: ["失败", "b-bad"], running: ["运行中", "b-warn"], queued: ["排队", "b-mute"]};
// 任务的显示状态：暂停任务（清单里等条件放行的占位任务）与被信号终止的失败单独标出
const stOf = j => j.suspended && j.status === "running" ? ["已挂起", "b-warn"] : j.hold ? ({running: ["暂停中", "b-warn"], queued: ["暂停（排队）", "b-mute"], done: ["已放行", "b-mute"], failed: ["暂停出错", "b-bad"]})[j.status]
  : j.status === "failed" && j.killed ? ["被终止", "b-warn"] : ST[j.status];
const retShown = h => D.lanes.some(l => l.host === h.id && l.unfinished);     // 已归还的主机还单列：它上面还有任务没跑完
// 交给算力池、还没放到哪台的车道（#89）：池不是主机，没有卡、没有推演，池车道不画一行，在时间线下面与「运行中」里写原因；
// 它跑过、在跑的任务带着实际那台（host：跑完的按用量记录补，collect._attempts，#99），照 #100 画在那台下面，只有还没放的不进时间线
const poolLanes = () => D.lanes.filter(l => l.pool);
const inPool = j => !j.host && !!D.lanes.find(l => l.id === j.lane)?.pool;
// 车道此刻的状态类别：判断顺序只在这一处，laneState 的整句与紧凑视图“没在跑”那一行的计数都按它（#86）
const laneKind = l => l.returned ? "returned" : l.paused ? "paused" : l.holding ? "holding" : l.alive ? "alive" : l.waiting ? "waiting"
  : l.started === false ? "unstarted" : l.unfinished ? (l.managed ? "managed" : "gone") : "done";
const laneState = l => ({
  returned: () => `主机已归还（${ts(l.returned)}）` + (l.read_via ? `，经 ${l.read_via} 读共享盘` : l.frozen_at ? `，显示归还前 ${ts(l.frozen_at)} 的状态` : "") + (l.unfinished ? `，还有 ${l.unfinished} 个任务没跑完` : ""),
  paused: () => "已暂停：" + l.paused,
  holding: () => D.jobs.some(j => j.lane === l.id && j.suspended) ? "任务被挂起（SIGSTOP，kill -CONT 恢复）" : "暂停中（等条件放行）",
  alive: () => "队列在跑（PID " + l.pid + "）",
  waiting: () => "等待中：" + l.waiting + (l.pool && l.pool_since ? `（已等 ${dur(NOW - l.pool_since)}）` : "") + (l.stuck ? "；推演不出何时轮到：" + l.stuck : ""),
  unstarted: () => "未启动",
  managed: () => "排队中（worker 在管）" + (l.stuck ? "；推演不出何时跑完：" + l.stuck : ""),
  gone: () => "队列进程不在，排队任务没有预计时间",
  done: () => "已跑完"})[laneKind(l)]();
let GROUPS = Object.fromEntries((D?.groups || []).map(g => [g.id, g]));
const gcolor = id => GROUPS[id]?.color || "#888780";
const badge = (t, c) => `<span class="badge ${c}">${esc(t)}</span>`;
const jobsOf = lane => D.jobs.filter(j => j.lane === lane);
// 运行中、在车道之外的主机上跑的那一格（#100：清单搬走前那台放行的，在那台跑完，任务的 host 是那台）：时间线按格子实际在哪台分行（rowJobs），
// 车道名后面标「在 X 上跑完」（jobLane）；主机不在本项目的主机表里的（那台已没有本项目的登记）只写 id
const hostOf = id => D.hosts.find(h => h.id === id) || {id, label: id};
const rowJobs = (l, hid) => jobsOf(l.id).filter(j => (j.host || l.host) === hid);
const awayText = j => j.host ? `在 ${hostShort(hostOf(j.host))} 上跑完` : "";
const jobLane = (j, l) => laneName(l, D.hosts) + (j.host ? `（${awayText(j)}）` : "");
// 车道跑的计划项（按开始先后）：车道不绑定实验，跑什么从任务得出；gshort 是计划项的简称（自动分组去掉结尾的 _）
const holdGuess = js => js.some(j => j.hold && !j.deps && (j.status === "running" || j.status === "queued"));   // 有没写 after= 的占位任务：时长按估时猜
const laneGroups = js => [...new Set(js.filter(j => j.group && !j.hold).sort((a, b) => (jobT0(a) ?? Infinity) - (jobT0(b) ?? Infinity)).map(j => j.group))];
const gshort = id => id.replace(/[_-]+$/, "");
// 时间线条上写的任务名：自动分组的去掉计划项前缀（id 就是前缀；颜色与标题旁已表明计划项），占位任务去掉开头的 hold_ / pause_（条上写了“暂停”）；悬停里是全名
const barName = j => {
  const g = GROUPS[j.group], p = j.hold ? /^(hold|pause)[_-]+/i.exec(j.id)?.[0] : g?.auto ? g.id : null;
  return p && j.id.length > p.length && j.id.startsWith(p) ? j.id.slice(p.length) : j.id;
};
const jobT1 = j => j.status === "done" || j.status === "failed" ? j.end_ts : j.eta_ts;
const jobT0 = j => j.status === "queued" ? j.plan_start_ts : j.start_ts ?? (j.end_ts && j.est_min ? j.end_ts - j.est_min * 60 : null);
const jobFrac = j => j.progress ? j.progress[0] / j.progress[1] : j.dur_min ? Math.min(1, j.elapsed_min / j.dur_min) : 0;
// 时间线上运行中的条写的百分比：现在线在条上的位置（开始 → 预计结束），与填色同一口径。步数进度只是当前这段的（多段任务、开头加载不打进度时与它差得远），写在悬停里。
// 没有进度行也没有估时的（collect 写的 eta_source “无估时”，预计结束就是现在）不算百分比，条上写“无估时”
const runFrac = j => { const a = jobT0(j), e = jobT1(j); return a != null && e > a ? Math.max(0, Math.min(1, (NOW - a) / (e - a))) : 0; };
// 各类任务的 实际/估时（worker 的 duration 给的依据；依据里没写比值的补上）
const ratioText = x => `${x.cls}：${x.src}${x.src.includes("×") ? "" : `，约 ×${f1(x.k, 2)}`}`;
const HIST = host => (D.history || []).filter(r => r.host === host && r.ok !== false);

/* ---------- 折线小图：悬停显示十字线与数值 ---------- */
const CH = {};
let chN = 0;
// 单条曲线的面积用渐变：贴着曲线最深、往下淡到透明（数据平稳时不会成一块实心方块）；底部一条淡的基线；mean 画这段的平均虚线
function chart({series, t0, t1, ymax, ymin = 0, fmt = v => f1(v), H = 46, thr = null, area = true, mean = false}) {
  const W = 300, id = "ch" + chN++, gap = (D.interval || 120) * 3.5;
  ymax = Math.max(ymax ?? 0, ...series.flatMap(s => s.pts.map(p => p[1])), thr ?? 0, ymin + 1e-9);
  const X = t => (t - t0) / (t1 - t0) * W, Y = v => H - 2 - (H - 6) * (v - ymin) / (ymax - ymin);
  let s = "";
  for (const se of series) {
    const pts = se.pts.filter(p => p[0] >= t0 && p[1] != null);
    if (!pts.length) continue;
    let d = "", segs = [], cur = [];
    pts.forEach((p, i) => { if (i && p[0] - pts[i - 1][0] > gap) { segs.push(cur); cur = []; } cur.push(p); });
    segs.push(cur);
    for (const sg of segs) {
      const l = sg.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join("");
      if (area && series.length === 1) s += `<path d="${l}L${X(sg[sg.length - 1][0]).toFixed(1)},${H}L${X(sg[0][0]).toFixed(1)},${H}Z" fill="url(#${id}g)"/>`;
      d += l;
    }
    s += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
    if (mean) { const m = avg(pts.map(p => p[1])); s += `<line x1="0" x2="${W}" y1="${Y(m)}" y2="${Y(m)}" stroke="var(--muted)" stroke-opacity=".7" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>`; }
  }
  s = `<line x1="0" x2="${W}" y1="${Y(ymin)}" y2="${Y(ymin)}" stroke="var(--faint)" stroke-opacity=".5" vector-effect="non-scaling-stroke"/>` + s;
  if (area && series.length === 1) s = `<defs><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${series[0].color};stop-opacity:.28"/>`
    + `<stop offset="1" style="stop-color:${series[0].color};stop-opacity:0"/></linearGradient></defs>` + s;
  if (thr != null) s += `<line x1="0" x2="${W}" y1="${Y(thr)}" y2="${Y(thr)}" stroke="var(--bad)" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>`;
  CH[id] = {series, t0, t1, fmt};
  return `<svg class="ch" id="${id}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">${s}
    <line class="xh" x1="0" x2="0" y1="0" y2="${H}" stroke="var(--muted)" vector-effect="non-scaling-stroke" visibility="hidden"/></svg>`;
}
function chartHover(svg, e) {
  const c = CH[svg.id]; if (!c) return null;
  const r = svg.getBoundingClientRect(), f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), t = c.t0 + f * (c.t1 - c.t0);
  const xh = svg.querySelector(".xh"); xh.setAttribute("x1", f * 300); xh.setAttribute("x2", f * 300); xh.setAttribute("visibility", "visible");
  const lines = c.series.map(se => {
    let best = null; for (const p of se.pts) if (p[1] != null && (!best || Math.abs(p[0] - t) < Math.abs(best[0] - t))) best = p;
    return best && Math.abs(best[0] - t) < (c.t1 - c.t0) / 40 ? `${se.name ? se.name + "  " : ""}${c.fmt(best[1])}` : null;
  }).filter(Boolean);
  return ts(t) + (lines.length ? "\n" + lines.join("\n") : "\n无数据");
}

/* ---------- 顶栏与告警 ---------- */
// 告警按受众分（#142，common.js 的 forUser、alertBox）：给用户的算条数、进红框，只给实验会话的折在下面一行
function topline() {
  const al = forUser(D.alerts);
  const age = Date.now() / 1000 - NOW, stale = age > (D.thresholds?.stale_s ?? 420);   // 与 labmon wait 的 collector_stale 同一门槛（config.stale_limit，缺省配置是 7 分钟）
  const gone = D.hosts.filter(h => h.returned && !retShown(h));
  const pl = poolLanes().filter(l => l.unfinished);
  const hosts = D.hosts.filter(h => !gone.includes(h) && (!h.pool || pl.length || !h.ok)).map(h => h.pool ? `<span class="nw ${h.ok ? "mut" : ""}" style="${h.ok ? "" : "color:var(--bad)"}" ${tip("交给算力池、还没放到哪台的清单：看板挑一台入池的服务器放过去\n" + (pl.map(l => `${laneName(l, D.hosts)}：${laneState(l)}`).join("\n") || "") + (h.ok ? "" : "\n" + (h.error || "这一轮没读到池里的清单")))}>算力池里待放 ${pl.length} 条清单</span>`
    : h.returned ? `<span class="nw mut" ${tip(`已归还（${ts(h.returned)}），不再连接；还有任务没跑完`)}><span class="cdot" style="background:var(--faint)"></span> ${esc(h.label)} · 已归还</span>`
    : `<span class="nw" ${tip(h.ok ? "探针正常" : h.error || "失败")}><span class="cdot" style="background:${h.ok ? "var(--ok)" : "var(--bad)"}"></span> ${esc(h.label)}</span>${h.borrow ? " " + borrowBadge(h.borrow, NOW) : ""}`).join(" ")
    + (gone.length ? ` <span class="nw mut" ${tip(gone.map(h => `${h.label}：${ts(h.returned)} 归还`).join("\n") + "\n它们的车道照常显示结果")}>已还 ${gone.length} 台</span>` : "");
  // 嵌在看板里：标题、更新时间、立即采集与连不上的提示都在看板顶栏上（看板经 embedState 取），这里只留主机与告警
  const title = `<div class="project-title">${LIVE ? '<a class="sm" href="../../" style="color:var(--accent);text-decoration:none">← 全局调度</a>' : ""}<h1 ${tip(D.title)}>${esc(D.title)}</h1></div>`;
  const actions = LIVE ? `<div class="project-actions">${canWrite(D.id) ? `<button class="btn" data-now ${BUSY ? "disabled" : ""}>立即采集</button>` : ""}
    <a class="btn" href="../../#/p/${encodeURIComponent(D.id)}/manage" style="text-decoration:none" ${tip("到工作台打开这个项目的「管理」抽屉：主机与队列、调度、项目配置")}>管理</a></div>` : "";
  const update = `<span class="mut sm" style="${stale ? "color:var(--bad);font-weight:600" : ""}">${tsNear(NOW)} 更新${stale ? `（${Math.round(age / 60)} 分钟未更新）` : ""}</span>`;
  const alerts = al.length ? `<span class="sm" style="color:var(--bad);font-weight:600">⚠ ${al.length} 条告警</span>` : '<span class="sm" style="color:var(--ok)">✓ 无告警</span>';
  const meta = `<span class="sm">${hosts}</span> ${noWorkBadge(D.no_work_since)} ${alerts}`;
  const feedback = offBadge(OFFLINE, `，显示的是 ${tsNear(NOW)} 的数据`) || (BUSY ? '<span class="sm mut">采集中…</span>' : "");
  const s = `<div class="top">${EMBED ? meta : `${title}${actions}<div class="project-meta">${update} ${meta}</div>
    <div class="project-feedback" role="status">${feedback}</div>`}</div>`;
  return s + alertBox(D.alerts, SS.get("agal", false));
}

/* ---------- 指标块 ---------- */
function kpis() {
  const out = [], since = NOW - 6 * 3600;
  // 全部完成与里程碑余量
  const next = (D.markers || []).filter(m => m.ts > NOW).sort((a, b) => a.ts - b.ts)[0];
  const end = D.all_done_ts;
  let meter = "", sub = end ? `剩余约 ${dur(end - NOW)}` : D.no_work_since ? `<span ${tip(noWorkTip(D.no_work_since))}>${NO_WORK}</span>` : "没有未完成的任务";
  if (next && end) {
    const f = (end - NOW) / (next.ts - NOW), late = f > 1;
    meter = `<div class="meter" ${tip(`现在 → 全部完成 ${ts(end)} → ${next.label} ${ts(next.ts)}`)}><i style="width:${Math.min(100, f * 100)}%;background:${late ? "var(--bad)" : "var(--accent)"}"></i></div>`;
    sub = late ? `<span style="color:var(--bad)">晚于${esc(next.label)} ${dur(end - next.ts)}</span>` : `距${esc(next.label)}余 ${dur(next.ts - end)}`;
  }
  const busy = D.lanes.filter(l => l.unfinished && l.eta_ts).sort((a, b) => b.eta_ts - a.eta_ts);
  const lt = busy.map(l => `${ts(l.eta_ts)}  ${laneName(l, D.hosts)}${l.started === false ? "（未启动，按现在开跑估）" : l.has_hold ? "（含暂停）" : ""}${l.overrun ? "（当前任务已超估时，会更晚）" : ""}`).join("\n");
  const paused = D.lanes.filter(l => l.paused), holding = D.lanes.some(l => l.has_hold && l.unfinished);
  const over = busy.filter(l => l.overrun);
  if (over.length) sub += ` · <span style="color:var(--warn)">有任务超估时</span>`;
  if (paused.length) sub += ` · <span style="color:var(--warn)">${paused.length} 条车道暂停，未计入</span>`;
  else if (holding) sub += " · 含暂停";
  out.push(`<div class="kpi" ${lt ? tip("各车道预计完成：\n" + lt + (paused.length ? "\n已暂停（不计入）：" + paused.map(l => laneName(l, D.hosts)).join("、") : "") + (holding ? "\n含暂停任务，" + (holdGuess(D.jobs) ? "没写 after= 的时长按估时猜" : "按它等的任务预计结束算") : "")) : ""}><div class="k">全部完成${busy.length > 1 ? ` · 最晚 ${esc(laneName(busy[0], D.hosts))}` : ""}</div>
    <div class="v">${end ? ts(end) : "—"}${rebalMark(D.rebalance)}</div>${meter}<div class="s">${sub}</div></div>`);
  // GPU 与显存：逐卡显示（多主机时用主机 id 区分），两张卡片的颜色一一对应
  const gl = D.hosts.flatMap(h => h.ok ? (h.gpus || []).map(g => ({...g, host: h})) : []);
  if (gl.length) {
    const CC = ["var(--accent)", "#1D9E75", "#D85A30", "#7F77DD", "#D4537E", "#BA7517", "#639922", "#888780"];
    const multi = D.hosts.filter(h => (h.gpus || []).length).length > 1;
    const gname = g => multi ? hostShort(g.host) + ((g.host.gpus || []).length > 1 ? "·" + g.index : "") : "GPU" + g.index;
    const dot = (k, txt) => `<span class="nw"><span class="cdot" style="background:${CC[k % CC.length]}"></span> ${txt}</span>`;
    // 利用率：近 1 小时的吃满程度（只有保活时按 0，worker 的 10 秒样本，#51），utilText 出字；曲线是各卡近 10 分钟平均
    const series = gl.map((g, k) => ({name: gl.length > 1 ? gname(g) : "", color: CC[k % CC.length],
      pts: HIST(g.host.id).filter(r => r.busy && r.busy[g.index] != null).map(r => [r.t, r.busy[g.index]])}));
    const ut = g => utilText(gpuBusy(g.host, g.index), g.util), U = utilText(utilAvg(gl.map(g => gpuBusy(g.host, g.index)), gl.map(g => g.util)));
    const mine = utilMine(D.gpu_mine);
    // 卡与显存是整台主机的（含同机别的项目与 labmon 之外的进程）：本项目没任务在跑时写明，免得看成自己的
    const whole = "整台主机的数字，含同机别的项目与 labmon 之外的进程；本项目在跑 " + D.jobs.filter(j => j.status === "running" && !j.hold).length + " 个任务\n";
    // 是不是别人在用按此刻值判（只有保活时按 0）：近 1 小时平均里有本项目刚跑完的负载（#54 审查）
    const notMine = !D.jobs.some(j => j.status === "running" && !j.hold) && (avg(gl.map(g => gpuBusy(g.host, g.index)?.now ?? g.util)) || 0) > 5;
    const sub = [gl.length > 1 ? gl.map((g, k) => dot(k, `${esc(gname(g))} ${ut(g).big}`)).join(" · ") : esc(U.sub), mine ? esc(mine.sub) : "",
      notMine ? "本项目没有任务在跑：是别的项目或进程在用" : ""].filter(Boolean);
    out.push(`<div class="kpi" ${tip(whole + U.tip + "\n\n" + gl.map(g => `${g.host.label} GPU${g.index} ${g.name}\n  利用率 ${ut(g).big}（${ut(g).span}）${ut(g).sub ? " · " + ut(g).sub : ""} · ${f1(g.temp, 0)}°C · ${f1(g.power, 0)}/${f1(g.power_limit, 0)} W`).join("\n") + (mine ? "\n\n" + mine.tip : ""))}>
      <div class="k">GPU 利用率 · ${gl.length} 卡 · 整机</div><div class="v">${U.big.replace("%", "")}<small>%${U.span && U.span !== "此刻" ? " " + U.span : ""}${gl.length > 1 ? " 平均" : ""}</small></div>
      ${chart({series, t0: since, t1: NOW, ymax: 100, H: 22, area: gl.length === 1, fmt: v => f1(v, 0) + "%"})}
      ${sub.length ? `<div class="s">${sub.join("<br>")}</div>` : ""}</div>`);
    const used = sum(gl.map(g => g.mem_used)) / 1024, tot = sum(gl.map(g => g.mem_total)) / 1024;     // 显存探针给的是 MiB
    const procs = D.hosts.flatMap(h => (h.gpu_procs || []).map(p => ({...p, host: h})));
    // 每张卡一段，段宽按该卡总显存，段内填色为已用；一眼看出哪张卡还有余量
    const segs = gl.map((g, k) => {
      const f = g.mem_used / g.mem_total, c = f > 0.9 ? "var(--bad)" : CC[k % CC.length];
      return `<span class="sg" style="flex:${g.mem_total}"><i style="width:${f * 100}%;background:${c}"></i></span>`;
    }).join("");
    out.push(`<div class="kpi" ${tip(whole + gl.map(g => `${g.host.label} GPU${g.index}：已用 ${f1(g.mem_used / 1024)} / ${f1(g.mem_total / 1024, 0)} GiB，余 ${f1((g.mem_total - g.mem_used) / 1024)} GiB`).join("\n")
      + "\n" + (procs.map(p => `${multi ? hostShort(p.host) + " " : ""}PID ${p.pid}  ${f1(p.mem / 1024)} GiB  ${(p.cmd || "").slice(0, 60)}`).join("\n") || "无 GPU 进程"))}>
      <div class="k">显存${gl.length > 1 ? " · 逐卡" : ""} · 整机</div><div class="v">${f1(used, 0)}<small> / ${f1(tot, 0)} GiB</small></div>
      <div class="segs">${segs}</div>
      <div class="s">${gl.length > 1 ? gl.map((g, k) => dot(k, `${esc(gname(g))} 余 ${f1((g.mem_total - g.mem_used) / 1024, 0)}`)).join(" · ") + " GiB"
        : `${procs.length} 个进程 · 余 ${f1(tot - used, 0)} GiB`}</div></div>`);
  }
  // 任务
  const real = D.jobs.filter(j => !j.hold);
  const n = s => real.filter(j => j.status === s).length, total = real.length;
  if (total) {
    const seg = (k, c) => n(k) ? `<i style="width:${n(k) / total * 100}%;background:${c}"></i>` : "";
    const actL = D.lanes.filter(l => !l.done_lane), doneL = D.lanes.filter(l => l.done_lane);
    const listL = actL.length || doneL.length > 6 ? actL : D.lanes;
    const lt2 = [...listL.map(l => `${laneName(l, D.hosts)}：完成 ${l.done ?? 0}/${l.total ?? 0} · ${laneState(l)}`),
      ...(doneL.length && listL.length < D.lanes.length ? [`另有 ${doneL.length} 条已跑完的车道（共 ${sum(doneL.map(l => l.total || 0))} 个任务，不占车道编号）`] : [])].join("\n");
    out.push(`<div class="kpi" ${tip(lt2)}><div class="k">任务 · ${actL.length || D.lanes.length} 条车道${actL.length && doneL.length ? ` · ${doneL.length} 已跑完` : ""}</div><div class="v">${n("done")}<small> / ${total} 完成</small></div>
      <div class="meter">${seg("done", "var(--ok)")}${seg("running", "var(--accent)")}${seg("failed", "var(--bad)")}</div>
      <div class="s">运行 ${n("running")} · 排队 ${n("queued")}${n("failed") ? ` · <span style="color:var(--bad)">失败 ${n("failed")}</span>` : ""}</div></div>`);
  }
  // 磁盘余量：各主机的挂载点（采集给的是 GB，换成 GiB，与主机页同一口径）加上组里共用的共享盘（看板的共享盘统计，项目快照的 storage），显示离告警线最近的一块，悬停列出全部
  const ms = D.hosts.flatMap(h => (h.mounts || []).map(m => ({label: m.label, avail: m.avail_gb, total: m.total_gb, used_pct: m.used_pct, min: m.min_gb != null ? m.min_gb : null, host: h}))), sd = D.storage || {};
  if (sd.total) ms.push({label: "共享盘", avail: sd.free / GIB, total: sd.total / GIB, used_pct: 100 * (1 - sd.free / sd.total), min: sd.warn_gb ?? null, host: null});
  if (ms.length) {
    const m = ms.sort((a, b) => (a.avail - (a.min || 0)) - (b.avail - (b.min || 0)))[0];
    const low = m.min != null && m.avail < m.min;
    out.push(`<div class="kpi" ${tip(ms.map(x => `${x.host ? x.host.label + " " : ""}${x.label}：剩 ${f1(x.avail)} / ${f1(x.total, 0)} GiB`).join("\n"))}>
      <div class="k">磁盘余量</div><div class="v" style="${low ? "color:var(--bad)" : ""}">${f1(m.avail)}<small> GiB</small></div>
      <div class="meter"><i style="width:${m.used_pct}%;background:${low ? "var(--bad)" : "var(--muted)"}"></i>${m.min != null ? `<b style="left:${(1 - m.min / m.total) * 100}%"></b>` : ""}</div>
      <div class="s">${D.hosts.filter(h => !h.pool).length > 1 && m.host ? esc(hostShort(m.host)) + " " : ""}${esc(m.label)}${m.min != null ? ` · 线 ${f1(m.min, 0)} GiB` : ""}</div></div>`);
  }
  return `<div class="kpis">${out.join("")}</div>`;
}

/* ---------- 时间线（GPU 利用率、主机事件带、车道；可拖动、缩放） ---------- */
const GAP_S = 600;
let EV = {events: {}, occ: {}, colors: {}};   // 经 serve 打开时取 events.json：主机 30 天事件、同机别的项目的占用与配色（本项目的存储在快照的 storage）
const evs = h => EV.events?.[h] || [];
tlInit({get: (k, d) => LS.get(k, d), set: (k, v) => LS.set(k, v), now: () => NOW, draw: () => drawTimeline(),
  all: () => { const js = D.jobs.filter(j => !inPool(j)); return tlSpan([...js.map(jobT0).filter(Boolean), ...(D.attempts || []).map(x => x.t0)], js.map(jobT1).filter(Boolean)); },
  near: () => D.jobs.filter(j => !inPool(j)).map(j => [jobT0(j), jobT1(j), j.status === "running" || j.status === "queued"])});

// 临时指令事件 → {act, okind, target, until, at, glob}：worker 记事件时就带这些字段；glob 是项目级的（所有主机，serve.proj_events 标的），
// 与这台单独下的同种指令各自配对增撤
const GLOB_KEY = "|所有主机";
const AUTO_RET_S = 900;      // 到了约定时间，borrow.check 在之后那一轮工作台采集里下 drain：约定归还开始后这么久内起的 drain 算它
function ovrOf(e) {
  return e.act ? {act: e.act, okind: e.okind, target: e.target || null, until: e.until, at: e.at, glob: !!e.glob} : null;
}
// 一台主机的事件带：区间（掉线、drain、暂停、续租截止、没在采集）与时刻（换容器、续租）；worker 启动对用户没意义，不画（记录页里有）
function hostBands(hid) {
  const iv = [], ticks = [], E = evs(hid);
  let down = null;
  for (const e of E) {
    if (e.kind === "host_down" && !down) down = e;
    else if (e.kind === "host_up" && down) { iv.push({k: "down", t0: down.t, t1: e.t, p: 0, short: "掉线", text: `${ts(down.t)} → ${ts(e.t)} 连不上：${down.msg}`}); down = null; }
    else if (e.kind === "container_new" && e.started)           // 本机发现时才记，按事件带的容器启动时刻 started 放；没有这个字段的旧事件不画
      ticks.push({k: "restart", t: e.started, p: 2, short: "重启", text: `${ts(e.started)} ${e.msg}`});
    else if (e.kind === "renew" || e.kind === "relaunch" || e.kind === "interrupt" || e.kind === "void" || e.kind === "squeeze")
      ticks.push({k: "renew", t: e.t, p: 3, short: {interrupt: "中断重跑", void: "作废重排", squeeze: "被挤重排"}[e.kind] || "续租", text: `${ts(e.t)} ${e.msg}`});
  }
  if (down) iv.push({k: "down", t0: down.t, t1: NOW, p: 0, short: "掉线", text: `${ts(down.t)} 起连不上：${down.msg}`});
  const open = {};
  const close = (key, t) => { const a = open[key], t1 = Math.min(t, a.until || t); if (t1 > a.t0) iv.push({...a, t1}); delete open[key]; };
  for (const e of E.filter(e => e.kind === "override" || e.kind === "borrow_return")) {
    // 归还时 finish 直接删掉这台的临时指令文件，不记撤销：这台的指令到这里；项目级的（所有主机）不在那个文件里，照旧开着
    if (e.kind === "borrow_return") { Object.keys(open).filter(k => !k.endsWith(GLOB_KEY)).forEach(k => close(k, e.t)); continue; }
    const o = ovrOf(e); if (!o || o.okind === "focus" || o.okind === "guest") continue;     // 借来的主机只限项目，不挡放行
    const key = o.okind + "|" + (o.target || "") + (o.glob ? GLOB_KEY : "");
    if (open[key]) close(key, e.t);             // 同一指令被撤销、到期或被新的同类指令替换：区间到这里
    const borrow = o.okind === "deadline" && o.target === "borrow";      // 约定归还：到点以后才挡新任务（之前只挡跑不完的）
    if (o.act === "add") open[key] = {k: o.okind, t0: borrow && o.at ? Math.max(e.t, o.at) : e.t, until: o.until, p: 4, borrow,
      short: borrow ? "约定归还" : {drain: "drain", pause: "暂停 " + (o.target || ""), deadline: "续租截止"}[o.okind] || o.okind, text: `${ts(e.t)} ${e.msg}`};
  }
  for (const a of Object.values(open)) { const t1 = Math.min(NOW, a.until || NOW); if (t1 > a.t0) iv.push({...a, t1, open: true}); }
  // 借来的主机上要还时下的 drain：点「跑完就还」「现在停」的（要还的事件带 act、now：borrow.request_return），或到了约定时间
  // borrow.check 自己下的（不记要还的事件：约定归还那段开始后 AUTO_RET_S 内起的 drain）。单独画，还没还的画到正在跑的预计跑完（那时自动归还）；
  // 与它重叠的约定归还那段并进这一条（#103：两条从同一时刻起、画在同一位置，标签叠在一起读不出），悬停两件事都写
  const hb = D.hosts.find(h => h.id === hid)?.borrow, who = hb?.holder || "对方";
  const dls = iv.filter(x => x.borrow), meets = (a, b) => a.t0 <= b.t1 && b.t0 <= a.t1;
  for (const x of iv.filter(x => x.k === "drain")) {
    const ask = E.find(e => e.kind === "borrow" && e.act === "return" && e.t >= x.t0 - 5 && e.t <= x.t0 + 120);
    const auto = !ask && dls.find(d => x.t0 >= d.t0 - 5 && x.t0 <= d.t0 + AUTO_RET_S);
    if (!ask && !auto) continue;
    const now = !!ask?.now, end = x.open && hb?.returning ? Math.max(NOW, ...D.lanes.filter(l => l.host === hid).flatMap(l => jobsOf(l.id))

  // 多于 COMPACT.sq 项时只画最近跑完的那些，最前面一个“…”
  const hov = !matchMedia("(hover: none)").matches, cut = Math.max(0, done.length - COMPACT.sq);
  const sq = (cut ? `<span class="mut" ${tip(`更早跑完的还有 ${cut} 项，点开看`)}>…</span>` : "")
    + done.slice(cut).map(g => `<span class="gsq" data-gsq="${esc(g.id)}" style="background:${g.color}" ${tip(`${g.label}\n完成 ${g.done}/${g.total}${fin(g) ? ` · ${ts(fin(g))} 跑完` : ""}\n${hov ? "点一下" : "再点一下"}定位到下面那一行`)}></span>`).join("");
  const dtip = (many ? `计划项多于 ${COMPACT.groups} 个，完成的都收在这里` : "一天前就跑完的收在这里") + `：${hov ? "移到" : "点"}小方块上看那一项，点这一行展开全部`;
  const rows = gs.filter(g => !old(g)).map(row).join("") + (done.length ? `<details class="gdone" ${SS.get("gdone", false) ? "open" : ""}>
    <summary class="sm mut" style="cursor:pointer;padding:4px 0" ${tip(dtip)}>已完成 ${done.length} 项 · ${sum(done.map(g => g.total))} 个任务${many ? "" : "（一天前就跑完的）"}<span class="sqs">${sq}</span></summary><div class="gdl">${done.map(row).join("")}</div></details>` : "");
  const ks = g => (g.ratios.some(x => x.open) ? g.ratios.filter(x => x.open) : g.ratios).map(x => x.k);   // 范围只算还有任务没跑完的类
  const span = g => Math.min(...ks(g)) === Math.max(...ks(g)) ? f1(ks(g)[0], 2) : `${f1(Math.min(...ks(g)), 2)}–${f1(Math.max(...ks(g)), 2)}`;
  const withR = D.groups.filter(g => g.ratios.length && !old(g));
  const cal = withR.map(g => `${esc(g.label)} ×${span(g)}`).join(" · ");
  const calTip = "各类任务（去掉种子编号的名字）实际耗时 / 清单估时；排队任务的预计时长已按此折算。同类还没跑完过的依次借同 tag、同名字前缀、同一清单、本项目的比值（各取中位数）\n"
    + withR.map(g => g.label + "\n" + g.ratios.map(x => "  " + ratioText(x) + (x.open ? "" : "（都跑完了）")).join("\n")).join("\n");
  return `<div class="card"><div class="row"><span class="hd">计划项</span><span class="sp"></span><span class="sm mut">完成数 · 预计完成</span></div>${rows}
    ${cal ? `<div class="sm mut" style="margin-top:4px" ${tip(calTip)}>实际 / 估时：${cal}</div>` : ""}</div>`;
}

/* ---------- 运行中 ---------- */
function runningCard() {
  const items = D.lanes.map(l => {
    const j = D.jobs.find(x => x.lane === l.id && x.status === "running");
    if (!j) return l.unfinished ? `<div class="job sm" style="color:${l.paused ? "var(--warn)" : l.alive || l.managed || l.started === false ? "var(--muted)" : "var(--bad)"}">${esc(laneName(l, D.hosts))}：${l.paused ? "⏸ " + esc(laneState(l)) : l.alive ? "等待下一个任务" : esc(laneState(l))}</div>` : "";
    if (j.suspended) return `<div class="job" ${tip(`${j.id}（${jobLane(j, l)}）\n进程被 SIGSTOP 挂起，kill -CONT 恢复\n日志最后更新 ${ts(j.log_mtime)}` + (j.last_line ? "\n" + j.last_line : ""))}>
      <div class="row"><span class="sm" style="color:var(--warn);font-weight:600">⏸ 已挂起</span><span class="mono ell">${esc(j.id)}</span><span class="sm mut ell hide-sm">${esc(jobLane(j, l))}</span><span class="sp"></span>
        <span class="sm nw">${j.progress ? j.progress[0] + "/" + j.progress[1] : ""} · 停在 ${tsNear(j.log_mtime)}</span></div>
      <div class="meter" style="margin:4px 0 0"><i style="width:${jobFrac(j) * 100}%;background:var(--muted)"></i></div></div>`;
    if (j.hold) return `<div class="job" ${tip(`${j.id}（${jobLane(j, l)}）\n开始 ${ts(j.start_ts)} · 已等 ${dur(j.elapsed_min * 60)}${holdLine(j)}` + (j.last_line ? "\n" + j.last_line : ""))}>
      <div class="row"><span class="sm" style="color:var(--warn);font-weight:600">⏸ 暂停中</span><span class="mono ell">${esc(j.id)}</span><span class="sm mut ell hide-sm">${esc(jobLane(j, l))}</span><span class="sp"></span>
        <span class="sm nw">已等 <b>${dur(j.elapsed_min * 60)}</b>${j.deps ? ` · 预计 ${tsNear(j.eta_ts)} 放行` : ""}</span></div>
      <div class="sm mut ell" style="margin-top:3px">${esc(j.last_line || "等条件放行")}</div></div>`;
    const f = jobFrac(j), sp = (j.speed || []).filter(p => p[0] >= NOW - 6 * 3600);
    return `<div class="job" ${tip(`${j.id}（${jobLane(j, l)}）\n开始 ${ts(j.start_ts)} · 已用 ${dur(j.elapsed_min * 60)}\n预计结束依据：${j.eta_source}` + (j.last_line ? "\n" + j.last_line : ""))}>
      <div class="row"><span class="dot" style="background:${gcolor(j.group)}"></span><span class="mono ell">${esc(j.id)}</span><span class="sm mut ell hide-sm">${esc(jobLane(j, l))}</span><span class="sp"></span>
        <span class="sm nw">${j.overrun_min ? `<span style="color:var(--warn)">超估时 <b>+${dur(j.overrun_min * 60)}</b></span> · 估 ${dur(j.dur_min * 60)}` : `剩 <b>${dur(j.remaining_min * 60)}</b> · ${tsNear(j.eta_ts)}`}</span></div>
      <div class="row" style="margin-top:4px"><div class="meter" style="flex:1;margin:0"><i class="${j.overrun_min ? "ovr" : ""}" style="width:${f * 100}%;background-color:${gcolor(j.group)}"></i></div>
        <span class="sm num nw" style="width:92px;text-align:right">${j.progress ? `${j.progress[0]}/${j.progress[1]}` : j.overrun_min ? "超估时" : Math.round(f * 100) + "% 估"}</span></div>
      ${sp.length >= 2 ? speedTile(j, sp)
        : `<div class="sm mut" style="margin-top:2px">${j.progress ? "速度曲线需要两次以上进度采样" : j.overrun_min ? "日志没有进度行，已超出估时，完成时间未知" : "日志没有进度行，按估时推算"}</div>`}</div>`;
  }).join("");
  const run = D.jobs.filter(j => j.status === "running"), many = run.length > COMPACT.run, compact = many && LS.get("runview", "compact") === "compact";
  const sw = many ? `<div class="seg">${[["compact", "紧凑"], ["full", "详细"]].map(([k, v]) => `<button data-rv="${k}" class="${(compact ? "compact" : "full") === k ? "on" : ""}">${v}</button>`).join("")}</div>` : "";
  return `<div class="card"><div class="row"><span class="hd">运行中</span>${many ? `<span class="sm mut">${run.length} 个</span>` : ""}<span class="sp"></span>${sw || `<span class="sm mut">进度 · 速度</span>`}</div>
    ${compact ? runCompact(run) : items || `<div class="sm mut">没有正在运行的任务</div>`}</div>`;
}
// 运行中占位任务悬停里放行的那一句（详细视图与紧凑行共用）：写了依赖的是推演的放行时刻，没写的给估时
const holdLine = j => j.deps ? `\n预计 ${ts(j.eta_ts)} 放行（${j.dur_src}；放不放仍看它自己的条件）` : j.est_min ? "\n估时 " + dur(j.est_min * 60) + "（等条件放行，实际可长可短）" : "";
// 紧凑视图：按计划项分组（组按最早结束排，没分组的归「未分组」），组头一行汇总、可收起；组内一个任务一行，速度与依据放悬停；没在跑的车道合成一行
function runCompact(run) {
  const by = new Map();
  for (const j of [...run].sort((a, b) => (a.eta_ts ?? Infinity) - (b.eta_ts ?? Infinity))) {
    const k = j.group || "";
    if (!by.has(k)) by.set(k, []);
    by.get(k).push(j);
  }
  const closed = SS.get("rclosed", []), lane = j => D.lanes.find(l => l.id === j.lane) || {id: j.lane, label: j.lane, host: ""};
  const row = j => {
    const l = lane(j), ln = jobLane(j, l), f = jobFrac(j), c = gcolor(j.group);
    const sp = (j.speed || []).filter(p => p[0] >= NOW - 6 * 3600);
    const tt = `${j.id}（${ln}）\n开始 ${ts(j.start_ts)} · 已用 ${dur(j.elapsed_min * 60)}` + (j.progress ? `\n进度 ${j.progress[0]}/${j.progress[1]}` : "")
      + (sp.length >= 2 ? `\n速度 现在 ${f1(j.rate_per_min, 1)} · 近 ${dur(NOW - sp[0][0])} 均 ${f1(avg(sp.map(p => p[1])), 1)} 步/分` : "")
      + (j.hold ? holdLine(j) || "\n等条件放行" : j.suspended ? "\n进程被 SIGSTOP 挂起，kill -CONT 恢复" : j.eta_source ? `\n预计结束 ${ts(j.eta_ts)}（依据：${j.eta_source}）` : "")
      + (j.last_line ? "\n" + j.last_line : "");
    const right = j.hold ? `<span style="color:var(--warn)">⏸ 已等 ${dur(j.elapsed_min * 60)}</span>` : j.suspended ? `<span style="color:var(--warn)">⏸ 挂起 · 停在 ${tsNear(j.log_mtime)}</span>`
      : j.overrun_min ? `<span style="color:var(--warn)">超估时 +${dur(j.overrun_min * 60)}</span>` : `剩 <b>${dur(j.remaining_min * 60)}</b> · ${tsNear(j.eta_ts)}`;
    return `<div class="jr" ${tip(tt)}><span class="mono ell">${esc(barName(j))}</span><span class="sm mut ell hide-sm">${esc(ln)}</span>
      <div class="meter" style="margin:0"><i class="${j.overrun_min ? "ovr" : ""}" style="width:${(j.hold ? 0 : f) * 100}%;background-color:${j.suspended ? "var(--muted)" : c}"></i></div>
      <span class="sm num ell" style="text-align:right">${right}</span></div>`;
  };
  let s = "";
  for (const [k, js] of by) {
    const g = GROUPS[k], ends = js.filter(j => !j.hold).map(j => j.eta_ts).filter(Boolean), first = ends.length ? Math.min(...ends) : null;   // 占位任务的放行不算“结束”
    const gt = `${g ? g.label : "未分组（占位任务与没归到计划项的）"}：${js.length} 个在跑` + (ends.length ? `\n最早 ${ts(first)}、最晚 ${ts(Math.max(...ends))} 结束` : "")
      + "\n车道：" + [...new Set(js.map(lane).map(l => laneName(l, D.hosts)))].join("、");
    s += `<details class="rgrp" data-rg="${esc(k)}" ${closed.includes(k) ? "" : "open"}><summary ${tip(gt)}><span class="dot" style="background:${g ? g.color : "var(--faint)"}"></span>
      <b class="ell">${esc(g ? g.label : "未分组")}</b><span class="sm mut nw">${js.length} 个在跑${first ? ` · 最早 ${tsNear(first)} 结束` : ""}</span></summary>${js.map(row).join("")}</details>`;
  }
  const idle = D.lanes.filter(l => l.unfinished && !run.some(j => j.lane === l.id));
  if (idle.length) {
    const KN = {returned: "已归还", paused: "暂停", holding: "暂停中", alive: "排队", waiting: "等待", unstarted: "未启动", managed: "排队", gone: "队列进程不在", done: "已跑完"};
    const cnt = {}; for (const l of idle) cnt[KN[laneKind(l)]] = (cnt[KN[laneKind(l)]] || 0) + 1;
    const bad = idle.some(l => laneKind(l) === "gone");
    s += `<div class="sm" style="margin-top:6px;color:${bad ? "var(--bad)" : "var(--muted)"}" ${tip(idle.map(l => `${laneName(l, D.hosts)}：${laneState(l)}`).join("\n"))}>另有 ${idle.length} 条车道没在跑：${Object.entries(cnt).map(([k, n]) => `${k} ${n}`).join(" · ")}</div>`;
  }
  return s;
}

// 运行中任务的速度小图：浅底、计划项颜色的面积，标题写明是什么、看的哪段时间，右边是现在与这段的平均
function speedTile(j, sp) {
  const t0 = sp[0][0], mean = avg(sp.map(p => p[1]));
  return `<div class="mini" style="margin-top:5px;padding:4px 9px 3px" ${tip(`进度速度（每分钟走几步，按日志里的 PROGRESS 行算）\n近 ${dur(NOW - t0)}：平均 ${f1(mean, 1)}、最低 ${f1(Math.min(...sp.map(p => p[1])), 1)}、最高 ${f1(Math.max(...sp.map(p => p[1])), 1)} 步/分\n虚线是平均，底线是 0；悬停曲线看各时刻的值`)}>
    <div class="row sm"><span class="mut nw">速度 · 近 ${dur(NOW - t0)}</span><span class="sp"></span>
      <span class="num nw">现在 <b>${f1(j.rate_per_min, 1)}</b> <span class="mut">· 均 ${f1(mean, 1)} 步/分</span></span></div>
    ${chart({series: [{name: "", color: gcolor(j.group), pts: sp}], t0, t1: NOW, H: 26, mean: true, fmt: v => f1(v, 1) + " 步/分"})}</div>`;
}

/* ---------- 资源小图 ---------- */
function resourcesCard() {
  const hrs = LS.get("rw", 6), t0 = NOW - hrs * 3600;
  const tile = (label, val, ch, tt) => `<div class="mini" ${tt ? tip(tt) : ""}><div class="row sm"><span class="mut ell">${label}</span><span class="sp"></span><b class="num nw">${val}</b></div>${ch}</div>`;
  const line = (pts, ymax, fmt, o = {}) => chart({series: [{name: "", color: o.color || "var(--accent)", pts}], t0, t1: NOW, ymax, fmt, thr: o.thr});
  const block = (head, chips, tiles) => `<div class="hgrp"><div class="row hhd"><b class="nw">${head}</b><span class="chips">${chips.join("")}</span></div><div class="minis">${tiles.join("")}</div></div>`;
  const out = [];
  // 每台主机一组：组头放状态与小标签（温度功耗、检查、本项目存储），组内小图不再重复主机名
  for (const h of D.hosts) {
    if (h.pool) continue;                              // 算力池（#24）：没有 GPU 与挂载点，车道在下面照常列
    if (h.returned) {
      if (!retShown(h)) continue;                      // 已还、任务都跑完了：顶栏收成「已还 N 台」
      const ls = D.lanes.filter(l => l.host === h.id), via = ls.find(l => l.read_via)?.read_via;
      out.push(`<div class="hgrp"><div class="row hhd mut"><b class="nw"><span class="cdot" style="background:var(--faint)"></span> ${esc(h.label)}</b>
        <span class="sm">已归还（${ts(h.returned)}），不再连接${ls.length ? (via ? `；它的车道经 ${esc(via)} 读共享盘` : "；它的车道显示归还前的状态") : ""}</span></div></div>`);
      continue;
    }
    const H = HIST(h.id), cg = h.cgroup || {}, gp = h.gpus || [], tiles = [], chips = [];
    if (gp.length) {
      const cols = ["var(--accent)", "#1D9E75", "#D85A30", "#7F77DD", "#D4537E", "#BA7517", "#639922", "#888780"];
      const series = gp.map((g, k) => ({name: gp.length > 1 ? "GPU" + g.index : "", color: cols[k % cols.length], pts: H.filter(r => r.busy && r.busy[k] != null).map(r => [r.t, r.busy[k]])}));
      const U = utilText(utilAvg(gp.map(g => gpuBusy(h, g.index)), gp.map(g => g.util)));
      tiles.push(tile(`GPU 利用率${gp.length > 1 ? " · " + gp.length + " 卡" : ""}`, `${U.big}${U.span ? `<span class="mut" style="font-weight:400"> ${U.span}</span>` : ""}`, chart({series, t0, t1: NOW, ymax: 100, fmt: v => f1(v, 0) + "%"}),
        U.tip + "\n曲线是各卡近 10 分钟平均\n\n" + gp.map(g => `GPU${g.index} ${g.name}  ${utilText(gpuBusy(h, g.index), g.util).big}  ${f1(g.temp, 0)}°C  ${f1(g.power, 0)}/${f1(g.power_limit, 0)} W`).join("\n")));
      const tot = sum(gp.map(g => g.mem_total)) / 1024;     // 显存探针给的是 MiB
      tiles.push(tile(`显存 · ${f1(tot, 0)} GiB`, f1(sum(gp.map(g => g.mem_used)) / 1024, 1) + " GiB",
        line(H.filter(r => r.mem).map(r => [r.t, sum(r.mem) / 1024]), tot, v => f1(v) + " GiB"),
        (h.gpu_procs || []).map(p => `PID ${p.pid}  ${f1(p.mem / 1024)} GiB  ${(p.cmd || "").slice(0, 60)}`).join("\n") || "无 GPU 进程"));
      for (const g of gp) chips.push(`<span class="chip">${gp.length > 1 ? "GPU" + g.index + " " : ""}${f1(g.temp, 0)}°C · ${f1(g.power, 0)} W</span>`);
    }
    if (cg.cpu_quota) tiles.push(tile(`CPU · ${f1(cg.cpu_quota, 0)} 核`, f1(h.cpu_pct, 0) + "%",
      line(H.filter(r => r.cpu_pct != null).map(r => [r.t, r.cpu_pct]), 100, v => f1(v, 0) + "%"), `负载 ${(h.loadavg || []).map(v => f1(v)).join(" / ")}`));
    if (cg.mem_rss || cg.mem_used) tiles.push(tile(`内存${cg.mem_limit ? " · " + f1(cg.mem_limit / GIB, 0) + " GiB" : ""}`, f1((cg.mem_rss || 0) / GIB, 1) + " GiB",
      line(H.filter(r => r.ram).map(r => [r.t, r.ram / GIB]), 0, v => f1(v) + " GiB"), `进程 ${f1((cg.mem_rss || 0) / GIB)} GiB · 含缓存 ${f1((cg.mem_used || 0) / GIB)} GiB`));
    for (const m of h.mounts || []) {     // 采集给的是 GB（历史曲线也是），换成 GiB
      const low = m.min_gb != null && m.avail_gb < m.min_gb;
      tiles.push(tile(esc(m.label), `<span style="${low ? "color:var(--bad)" : ""}">余 ${f1(m.avail_gb)} GiB</span>`,
        line(H.filter(r => r.disk && r.disk[m.path] != null).map(r => [r.t, r.disk[m.path]]), 0, v => "余 " + f1(v) + " GiB", {color: low ? "var(--bad)" : "var(--muted)", thr: m.min_gb != null ? m.min_gb : null}),
        `${m.path}\n总 ${f1(m.total_gb, 0)} GiB · 已用 ${f1(m.used_pct, 1)}%${m.min_gb != null ? " · 告警线 " + f1(m.min_gb, 0) + " GiB（红虚线）" : ""}`));
    }
    for (const c of h.checks || []) {
      const col = c.state === "ok" ? "var(--ok)" : c.state === "fail" ? "var(--faint)" : "var(--line)";
      chips.push(`<span class="chip" ${tip([c.out, ...(c.detail || [])].filter(Boolean).join("\n") || "无输出")}><span class="cdot" style="background:${col}"></span> ${esc(c.label)}：${c.state === "ok" ? "是" : c.state === "fail" ? "否" : "不适用"}</span>`);
    }
    // 共享盘各服务器挂的是同一块，只在第一台主机上写一次；本地盘按主机
    const sg = D.storage || {}, sh = h === D.hosts.find(x => !x.pool) ? sg.dirs || [] : [], loc = sg.local?.[h.id], lb = loc ? (loc.cache || 0) + (loc.scratch || 0) : 0;
    if (sh.length || loc) chips.push(storageChip(sg, sh, loc, lb));
    const head = `<span class="cdot" style="background:${h.ok ? "var(--ok)" : "var(--bad)"}" ${tip(h.ok ? "探针正常" : h.error || "失败")}></span> ${esc(h.label)}${h.borrow ? " " + borrowBadge(h.borrow, NOW) : ""}${h.stale ? ` <span class="sm" style="color:var(--bad)">（显示 ${ts(h.last_ok)} 的数据）</span>` : ""}`;
    out.push(block(head, chips, tiles.length ? tiles : [`<div class="sm mut">没有数据</div>`]));
  }
  const card = `<div class="card" style="margin-top:10px"><div class="row"><span class="hd">资源</span><span class="sm mut hide-sm">整台主机的数字，含同机别的项目与 labmon 之外的进程</span><span class="sp"></span>
    <div class="seg">${[6, 24].map(v => `<button data-rw="${v}" class="${v === hrs ? "on" : ""}">${v} 小时</button>`).join("")}</div></div>
    ${out.join("")}</div>`;
  // 嵌在工作台里时主机资源与主机页重复，默认收起
  return EMBED ? `<details class="res" ${SS.get("resOpen", false) ? "open" : ""}><summary>资源（主机按任务的明细见工作台的主机页）</summary>${card}</details>` : card;
}

// 项目根下一个目录的叫法（storage.dirs 的 name）：「.」是项目根本层的文件，空串是还没拆开时的整个项目目录（collect.dir_name 同一口径）
const dirName = n => n === "." ? "项目根下的文件" : n || "整个项目目录";
// 「资源」里本项目的存储一格（项目快照的 storage，disk.project_storage，#53）：共享盘上本项目的合计与近 24 小时增量（涨得快时标色，同 disk: 告警），
// 悬停按项目根下的一级目录列占用与增量，再列近来写得多的任务（跑的期间本项目目录净增，同期本项目别的任务也算在内）；本地盘这台的缓存与单格临时
function storageChip(sg, sh, loc, lb) {
  const dirs = [...sh].sort((a, b) => (b.b || 0) - (a.b || 0)), jobs = (sg.jobs || []).filter(j => j.wait || Math.abs(j.b) >= GIB).slice(0, 6);
  const lines = [];
  if (sh.length) {
    lines.push(`本项目在共享盘上（${(sg.roots || []).join("、") || "项目目录"}；看板的共享盘统计，限速轮流扫）：`,
      ...dirs.map(d => `${dirName(d.name)}  ${GB(d.b)} GiB · 24 小时 ${dGB(d.d24)} · 7 天 ${dGB(d.d7)}（${ts(d.t)} 扫）`),
      ...(sg.gone || []).filter(g => g.d7).map(g => `${dirName(g.name)}（已删）  7 天 ${dGB(g.d7)}`));
    if (sg.pending) lines.push(`还有 ${sg.pending} 个目录没扫到，合计只算扫过的`);
    if (jobs.length) lines.push("", "近来写得多的任务（跑的期间本项目目录净增，同期别的任务写的也在内）：",
      ...jobs.map(j => `${j.name}  ${dGB(j.b)} GiB${j.top?.[0] && j.top[0][1] > 0 ? `（${dirName(j.top[0][0])} ${dGB(j.top[0][1])}）` : ""}${j.wait ? " · 还在等重扫" : ""} · ${ts(j.t1)} 结束`));
    if (sg.free != null) lines.push("", `共享盘剩 ${GB(sg.free)} GiB${sg.eta != null ? `，按近 24 小时约 ${sg.eta} 天满` : ""}；按人看在组内服务器的「共享盘」`);
  }
  if (loc) lines.push(`这台的本地盘：缓存 ${f1((loc.cache || 0) / GIB, 2)} GiB · 单格临时目录 ${f1((loc.scratch || 0) / GIB, 2)} GiB`);
  const d24 = sg.d24 && Math.abs(sg.d24) >= GIB ? ` · 24 小时 ${dGB(sg.d24)}` : "";
  const label = sh.length ? `本项目占用 ${GB(sg.b)} GiB${d24}${lb >= GIB ? ` · 本地 ${f1(lb / GIB, 1)} GiB` : ""}` : `本项目本地 ${f1(lb / GIB, 1)} GiB`;
  return `<span class="chip" ${tip(lines.join("\n"))}${sg.burst ? ` style="color:var(--warn);font-weight:600"` : ""}>${esc(label)}</span>`;
}

/* ---------- 任务明细（默认折叠） ---------- */
function jobDetails() {
  if (!D.jobs.length) return "";
  const filt = LS.get("filter", "open"), gf = LS.get("gfilter", ""), opened = SS.get("open", null), more = SS.get("more", {});
  let s = `<div class="row" style="flex-wrap:wrap;gap:8px;margin-top:6px"><div class="seg">${[["open", "未完成"], ["all", "全部"], ["failed", "失败"]].map(([k, v]) =>
    `<button data-f="${k}" class="${k === filt ? "on" : ""}">${v}</button>`).join("")}</div>
    ${D.groups.length ? `<div class="seg"><button data-g="" class="${gf ? "" : "on"}">全部计划项</button>${D.groups.map(g => `<button data-g="${esc(g.id)}" class="${gf === g.id ? "on" : ""}"><span class="dot" style="background:${g.color}"></span> ${esc(g.label)}</button>`).join("")}</div>` : ""}</div>`;
  const order = {running: 0, failed: 1, queued: 2, done: 3};
  const laneBlock = l => {
    let js = jobsOf(l.id).filter(j => (!gf || j.group === gf) && (filt === "all" || (filt === "failed" ? j.status === "failed" : j.status !== "done")));
    js.sort((a, b) => order[a.status] - order[b.status] || (a.status === "done" ? (b.end_ts || 0) - (a.end_ts || 0) : 0));
    const lim = more[l.id] ? 1e9 : 12, hidden = Math.max(0, js.length - lim);
    return `<details class="lane" data-lane="${esc(l.id)}" ${opened ? (opened.includes(l.id) ? "open" : "") : "open"}><summary><b>${esc(laneName(l, D.hosts))}</b> <span class="sm mut">${esc(laneGroups(jobsOf(l.id)).map(gshort).map(g => g + " · ").join(""))}完成 ${l.done ?? 0}/${l.total ?? 0}</span></summary>
      <div class="scroll"><table><tr><th>任务</th><th>状态</th><th class="r">预计时长</th><th class="r">已用 / 实际</th><th class="r hide-sm">开始</th><th class="r">结束 / 预计</th><th class="hide-sm">最近输出</th></tr>
      ${js.slice(0, lim).map(j => {
        const est = j.dur_min == null ? "—" : j.est_min == null || Math.abs(j.dur_min - j.est_min) > .5
          ? `<span style="border-bottom:1px dotted var(--muted)" ${tip((j.est_min != null ? "清单估时 " + dur(j.est_min * 60) + "，" : "清单没写估时，") + "预计按" + j.dur_src)}>${dur(j.dur_min * 60)}</span>` : dur(j.est_min * 60);
        return `<tr id="job-${esc(j.id)}" class="${j.status === "running" ? "run" : ""}"><td class="mono"><span class="dot" style="background:${gcolor(j.group)}"></span> ${esc(j.id)}</td>
        <td>${badge(...stOf(j))}${j.host ? ` <span class="sm mut nw">${esc(awayText(j))}</span>` : ""}</td><td class="r">${est}</td><td class="r">${j.actual_min != null ? dur(j.actual_min * 60) : j.elapsed_min != null ? dur(j.elapsed_min * 60) : "—"}</td>
        <td class="r hide-sm">${tsNear(jobT0(j))}</td><td class="r">${tsNear(jobT1(j))}</td><td class="mono mut ell hide-sm" style="max-width:340px" ${j.last_line ? tip(j.last_line) : ""}>${esc(j.last_line || "")}</td></tr>`; }).join("")}
      ${hidden ? `<tr><td colspan="7"><span class="more" data-more="${esc(l.id)}">还有 ${hidden} 个，全部显示</span></td></tr>` : ""}
      ${!js.length ? `<tr><td colspan="7" class="mut">没有符合条件的任务</td></tr>` : ""}</table></div></details>`;
  };
  const actL = D.lanes.filter(l => !l.done_lane), doneL = D.lanes.filter(l => l.done_lane);
  const foldDone = doneL.length && (actL.length || doneL.length > 3);
  for (const l of foldDone ? actL : D.lanes) s += laneBlock(l);
  if (foldDone) s += `<details class="dlane-more" style="margin-top:6px"><summary class="sm mut" style="cursor:pointer;padding:4px 0">另有 ${doneL.length} 条已跑完的车道（${sum(doneL.map(l => l.total || 0))} 个任务）</summary>${doneL.map(laneBlock).join("")}</details>`;
  return `<details class="jobs" ${SS.get("jobsOpen", false) ? "open" : ""}><summary>任务明细（${D.jobs.length}）</summary>${s}</details>`;
}

const EMBED = (() => { try { return window.top !== window.self; } catch (e) { return true; } })();
function render() {
  const app = document.getElementById("app");
  if (!D) { app.textContent = "没有数据"; return; }
  chN = 0;
  let h = topline() + kpis();
  if (D.lanes.length) h += timelineCard();
  if (D.groups.length || D.lanes.length) h += `<div class="cols">${groupsCard()}${D.lanes.length ? runningCard() : ""}</div>`;
  h += resourcesCard() + jobDetails();
  h += `<p class="sm mut" style="margin-top:14px">${LIVE ? "每 15 秒取新数据" : `每 ${D.refresh} 秒刷新`} · 采集间隔 ${D.interval} 秒 · labmon</p>`;
  app.innerHTML = h;
  tipCheck();
  drawTimeline();
}

/* ---------- 交互 ---------- */
// 悬停提示的外壳在 common.js（tipBind）；这里只管曲线的十字线。嵌在看板里时看板会调本页的 hideTip
const xhHide = () => document.querySelectorAll("svg.ch .xh").forEach(x => x.setAttribute("visibility", "hidden"));
tipBind({
  hover(e) {
    try { if (parent !== window) parent.hideTip?.(); } catch (err) {}   // 嵌在看板里：看板上留下的提示过时了
    const svg = e.target.closest?.("svg.ch");
    document.querySelectorAll("svg.ch .xh").forEach(x => { if (!svg || !svg.contains(x)) x.setAttribute("visibility", "hidden"); });
    if (svg) { const t = chartHover(svg, e); if (t) return [t, svg]; }
  },
  hide: xhHide,
});
function saveView() {
  SS.set("scroll", window.scrollY);
  const j = document.querySelector("details.jobs"); if (j) SS.set("jobsOpen", j.open);
  const r = document.querySelector("details.res"); if (r) SS.set("resOpen", r.open);
  const gd = document.querySelector("details.gdone"); if (gd) SS.set("gdone", gd.open);
  const ag = document.querySelector("details.agal"); if (ag) SS.set("agal", ag.open);
  const ls = document.querySelectorAll("details.lane"); if (ls.length) SS.set("open", [...ls].filter(d => d.open).map(d => d.dataset.lane));
  const rg = document.querySelectorAll("details.rgrp"); if (rg.length) SS.set("rclosed", [...rg].filter(d => !d.open).map(d => d.dataset.rg));
}
function rerender() { const y = window.scrollY; saveView(); render(); window.scrollTo(0, y); }
// 新数据来了的重画：正在操作（选着日志、曲线上的字）就先不画，选区一取消再补
let PENDING = false;
function redraw() {
  if (editing("app")) { PENDING = true; return; }
  PENDING = false; rerender(); lastDraw = Date.now();
}
document.addEventListener("selectionchange", () => { if (PENDING) redraw(); });
document.addEventListener("focusout", () => setTimeout(() => { if (PENDING) redraw(); }));
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tl],[data-tz],[data-tlall],[data-rw],[data-rv],[data-f],[data-g],[data-more],[data-now],[data-tlkey],[data-gsq],rect.j");
  if (!t) { if (e.target.closest?.("#tlbox")) depHover(null); return; }      // 点时间线空白处：取消依赖高亮（触屏）
  if (t.matches("[data-gsq]")) { e.preventDefault(); gsqClick(t.dataset.gsq); }      // 不让外面的 <details> 自己开合
  else if (t.matches("[data-now]")) collectNow();
  else if (t.matches("[data-tl],[data-tz],[data-tlkey]")) tlClick(t);
  else if (t.dataset.tlall) { LS.set("tlall", !LS.get("tlall", false)); drawTimeline(); }
  else if (t.dataset.rw) { LS.set("rw", +t.dataset.rw); rerender(); }
  else if (t.dataset.rv) { LS.set("runview", t.dataset.rv); rerender(); }
  else if (t.dataset.f) { LS.set("filter", t.dataset.f); rerender(); }
  else if (t.matches("[data-g]")) { LS.set("gfilter", t.dataset.g); rerender(); }
  else if (t.dataset.more) { const m = SS.get("more", {}); m[t.dataset.more] = 1; SS.set("more", m); rerender(); }
  else if (t.matches("rect.j")) {
    const id = t.dataset.id, j = D.jobs.find(x => x.id === id); if (!j) return;
    if (!tapTwice(JTAP, id)) return depHover(id);      // 触屏第一次点：高亮它的上下游，再点才跳到任务明细
    if (j.status === "done" && LS.get("filter", "open") !== "all") LS.set("filter", "all");
    LS.set("gfilter", "");
    const m = SS.get("more", {}); m[j.lane] = 1; SS.set("more", m);
    const o = new Set(SS.get("open", D.lanes.map(l => l.id))); o.add(j.lane); SS.set("open", [...o]);
    SS.set("jobsOpen", true); render();
    const row = document.getElementById("job-" + id);
    if (row) { row.classList.add("hl"); row.scrollIntoView({block: "center"}); setTimeout(() => row.classList.remove("hl"), 2500); }
  }
});
document.addEventListener("toggle", e => { if (e.target.matches?.("details")) saveView(); }, true);
// 鼠标悬停任务条高亮它的上下游（depHover）；触屏、触控笔由点击（tapTwice）管，拖动平移时不换
document.addEventListener("pointerover", e => {
  if (e.pointerType !== "mouse" || TL.d?.moved) return;
  const g = e.target.closest?.("#tlbox [data-j]");
  depHover(g ? g.dataset.j : null);
});
window.addEventListener("beforeunload", saveView);
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(drawTimeline, 150); });
function setData(d) { D = d; NOW = d.generated; GROUPS = Object.fromEntries((d.groups || []).map(g => [g.id, g])); }
let lastDraw = Date.now();
// 不自动重试：打开页面时首次渲染等着它，连不上就先用页面里的快照画；没取到（EVOK 为假）由下一轮定时取数补（#177）
let EVOK = false;
async function loadEvents() {
  try { const r = await api("events.json", {cache: "no-store"}); if (r.ok) { EV = await r.json(); EVOK = true; } else EVOK = false; } catch (e) { EVOK = false; /* 取不到就不标空档原因 */ }
}
async function poll() {
  const was = OFFLINE, gen = NOW;
  try {
    const r = await api("snapshot.json", {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    setData(await r.json()); OFFLINE = pollNet(null);
  } catch (e) { OFFLINE = pollNet(e, poll); }
  const evMiss = !EVOK && !OFFLINE;                  // 上次事件没取到、这次连上了：补取
  if (NOW !== gen || evMiss) await loadEvents();
  if (NOW !== gen || OFFLINE !== was) tellTop();
  if (TL.d) return;                                 // 正在拖时间线：等松手后的下一轮再重画
  // 有新数据（含补到的事件）、连通状态变了、上一次被挡住没画（选区放久了也照画，见 editing），或过了一分钟（刷新“几分钟未更新”的提示）才重画
  if (NOW !== gen || (evMiss && EVOK) || OFFLINE !== was || PENDING || Date.now() - lastDraw > 60000) redraw();
}
async function collectNow() {
  BUSY = true; rerender(); tellTop();
  try {
    const r = await postJSON("collect", {}, {retry: true, onWait: () => { OFFLINE = netText("poll"); rerender(); tellTop(); }});     // 做两遍也没事：连不上自动重试
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    setData(j); OFFLINE = null;
    await loadEvents();
  } catch (e) { OFFLINE = "立即采集失败：" + (e.message || e); }
  BUSY = false; rerender(); lastDraw = Date.now(); tellTop();
}
// 嵌在看板里：看板顶栏显示这里的更新时间、采集中与连不上的提示（经 embedState 取），立即采集也由看板调 collectNow
function embedState() { return {now: NOW, offline: OFFLINE, busy: BUSY}; }
function tellTop() { if (EMBED) try { parent.frameChanged?.(); } catch (e) {} }
function first() { render(); window.scrollTo(0, SS.get("scroll", 0)); tellTop(); }
if (LIVE) { setInterval(poll, 15000); loadEvents().then(first); }      // 共享盘余量在 events.json 里：取到再画，磁盘余量才不会先显示别的盘再跳
else { first(); setTimeout(() => { saveView(); location.reload(); }, (D?.refresh || 60) * 1000); }
</script>
</body>
